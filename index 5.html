<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas · Panel</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--green:#159447;--red:#d83a3a;--orange:#d97706;--shadow:0 8px 28px rgba(20,30,40,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:245px;background:#111827;color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:21px;font-weight:800;padding:10px 12px 20px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#263244;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1600px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:var(--accent);color:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--red)}.btn.green{background:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:27px;font-weight:800;margin-top:8px}.positive{color:var(--green)}.negative{color:var(--red)}.section{margin-top:20px}.section h2{font-size:17px;margin:0 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}.table th{color:var(--muted);font-size:12px}.right{text-align:right!important}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d6dbe1;border-radius:9px;background:#fff;color:var(--text)}.filters>*{width:auto;min-width:145px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.span2{grid-column:1/-1}.bar{height:9px;background:#edf0f2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.row-actions{display:flex;gap:6px}.mini{padding:6px 9px;border-radius:7px;background:#f1f3f5;font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.dialog h3{margin:0 0 15px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:11px 15px;border-radius:9px;display:none;z-index:20}.mobile-nav{display:none}.chartbox{padding:8px 0 0}.charttitle{font-weight:700;font-size:14px;margin-bottom:3px}.chartbox svg{width:100%;height:190px;display:block}.axis{font-size:10px;fill:#6b7280}.chart{height:180px;display:flex;align-items:flex-end;gap:5px}.barcol{flex:1;min-width:8px;background:var(--accent);border-radius:5px 5px 0 0;position:relative}.barcol span{position:absolute;bottom:100%;font-size:9px;transform:translateX(-50%);left:50%;color:var(--muted)}@media(max-width:900px){.side{display:none}.main{margin:0;width:100%;padding:18px 14px 80px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111827;z-index:8;overflow:auto}.mobile-nav button{flex:1;min-width:75px;background:transparent;color:#cbd5e1;padding:9px 5px;font-size:11px}.mobile-nav button.active{color:#fff;background:#263244}.top h1{font-size:23px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.filters>*{flex:1;min-width:120px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">💶 Finanzas</div><div class="nav" id="nav"></div></aside><main class="main"><div id="view"></div></main></div><div class="mobile-nav" id="mnav"></div>
<div class="modal" id="modal"><div class="dialog"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="dialog-foot"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="modalSave">Guardar</button></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='finanzas_single_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const defaultState={accounts:[],movements:[],recurring:[],people:[],categories:[{id:uid(),name:'Vivienda',type:'expense'},{id:uid(),name:'Alimentación',type:'expense'},{id:uid(),name:'Transporte',type:'expense'},{id:uid(),name:'Ocio',type:'expense'},{id:uid(),name:'Salud',type:'expense'},{id:uid(),name:'Otros',type:'expense'},{id:uid(),name:'Nómina',type:'income'},{id:uid(),name:'Otros ingresos',type:'income'}],subcategories:[],debts:[],collections:[],settings:{lastRecurringRun:''}};
let state=load(); state.people=Array.isArray(state.people)?state.people:[]; state.debts=Array.isArray(state.debts)?state.debts:[]; let page='dashboard';let modalSaveFn=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return {...defaultState,...x,settings:{...defaultState.settings,...(x.settings||{})}}}catch(e){}return structuredClone(defaultState)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function nav(){const items=[['dashboard','🏠','Resumen'],['accounts','💳','Cuentas'],['movements','💸','Movimientos'],['recurring','🔄','Recurrentes'],['categories','🗂️','Categorías'],['debts','🤝','Deudas / Split'],['history','📊','Histórico'],['irpf','🧮','IRPF'],['data','💾','Datos / Copias']];const html=items.map(i=>`<button class="${page===i[0]?'active':''}" onclick="go('${i[0]}')">${i[1]} ${i[2]}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mnav').innerHTML=html}
function go(p){page=p;nav();render();scrollTo(0,0)}
function accountBalance(id){const a=state.accounts.find(x=>x.id===id);let b=Number(a?.initial||0);state.movements.filter(m=>m.accountId===id).forEach(m=>b+=(m.type==='income'?1:-1)*Number(m.amount));state.movements.filter(m=>m.type==='transfer'&&(m.from===id||m.to===id)).forEach(m=>b+=(m.to===id?1:-1)*Number(m.amount));return b}
function totals(ms=state.movements){return ms.reduce((r,m)=>{if(m.type==='income')r.i+=+m.amount;if(m.type==='expense')r.e+=+m.amount;return r},{i:0,e:0})}
function render(){generateRecurring();document.getElementById('view').innerHTML=pages[page]();}
function monthMov(){const ym=today().slice(0,7);return state.movements.filter(m=>m.date?.startsWith(ym))}
function monthlySeries(){const map={};state.movements.filter(m=>m.type==='income'||m.type==='expense').forEach(m=>{const k=(m.date||'').slice(0,7);if(!k)return;if(!map[k])map[k]={income:0,expense:0};if(m.type==='income')map[k].income+=+m.amount;else map[k].expense+=+m.amount});let keys=Object.keys(map).sort();if(!keys.length){const k=today().slice(0,7);map[k]={income:0,expense:0};keys=[k]}return keys.slice(-12).map(k=>({label:k.slice(5)+'/'+k.slice(0,4),income:map[k].income,expense:map[k].expense,balance:map[k].income-map[k].expense}));}
function lineChart(data,key,title,cls){if(!data.length)return '';const vals=data.map(x=>+x[key]||0),max=Math.max(...vals,1),min=Math.min(...vals,0),range=max-min||1,w=640,h=190,p=28;const pts=data.map((x,i)=>{const X=p+(i*(w-2*p))/Math.max(data.length-1,1);const Y=p+(max-(+x[key]||0))*((h-2*p)/range);return [X,Y]}),d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');return `<div class="chartbox"><div class="charttitle">${title}</div><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${title}"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#e5e7eb"/><path d="${d}" fill="none" stroke="${cls==='expense'?'#d83a3a':cls==='income'?'#159447':'#2563eb'}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="white" stroke="${cls==='expense'?'#d83a3a':cls==='income'?'#159447':'#2563eb'}" stroke-width="2"><title>${data[i].label}: ${eur(data[i][key])}</title></circle>`).join('')}<text x="${p}" y="${h-6}" class="axis">${data[0].label}</text><text x="${w-p}" y="${h-6}" text-anchor="end" class="axis">${data[data.length-1].label}</text></svg></div>`}
function personName(id){return state.people.find(p=>p.id===id)?.name||''}
function debtByPerson(){const map={};state.debts.filter(d=>!d.collected).forEach(d=>{const n=d.person||personName(d.personId)||'Sin persona';map[n]=(map[n]||0)+ +d.amount});return Object.entries(map).sort((a,b)=>b[1]-a[1])}
const pages={
 dashboard(){const t=totals();const mt=totals(monthMov());const bal=state.accounts.reduce((s,a)=>s+accountBalance(a.id),0);const cats={};monthMov().filter(m=>m.type==='expense').forEach(m=>cats[m.category]=(cats[m.category]||0)+ +m.amount);const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);return `<div class="top"><div><h1>Resumen</h1><div class="sub">Situación financiera y actividad reciente</div></div><div class="actions"><button class="btn" onclick="openMovement('expense')">+ Gasto</button><button class="btn green" onclick="openMovement('income')">+ Ingreso</button><button class="btn secondary" onclick="openTransfer()">⇄ Transferencia</button></div></div><div class="grid"><div class="card metric"><div class="label">Balance total</div><div class="value ${bal>=0?'positive':'negative'}">${eur(bal)}</div></div><div class="card metric"><div class="label">Ingresos del mes</div><div class="value positive">${eur(mt.i)}</div></div><div class="card metric"><div class="label">Gastos del mes</div><div class="value negative">${eur(mt.e)}</div></div><div class="card metric"><div class="label">Balance del mes</div><div class="value ${mt.i-mt.e>=0?'positive':'negative'}">${eur(mt.i-mt.e)}</div></div></div><div class="two section"><div class="card"><h2>Cuentas</h2>${state.accounts.length?state.accounts.map(a=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(a.name)}</span><b>${eur(accountBalance(a.id))}</b></div>`).join(''):'<div class="empty">Añade tu primera cuenta.</div>'}</div><div class="card"><h2>Gastos por categoría · este mes</h2>${top.length?top.map(([k,v])=>`<div style="margin:11px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(k||'Sin categoría')}</span><b>${eur(v)}</b></div><div class="bar"><i style="width:${Math.max(3,v/(top[0][1]||1)*100)}%"></i></div></div>`).join(''):'<div class="empty">Sin gastos este mes.</div>'}</div></div><div class="card section"><h2>Movimientos recientes</h2>${movementTable(state.movements.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`},
 accounts(){return `<div class="top"><div><h1>Cuentas</h1><div class="sub">Saldo inicial + movimientos y transferencias</div></div><button class="btn" onclick="openAccount()">+ Cuenta</button></div><div class="grid">${state.accounts.map(a=>`<div class="card"><div class="sub">CUENTA</div><h2>${esc(a.name)}</h2><div class="value" style="font-size:25px;font-weight:800">${eur(accountBalance(a.id))}</div><div class="sub">Inicial: ${eur(a.initial)}</div><div class="actions" style="margin-top:12px"><button class="mini" onclick="openAccount('${a.id}')">Editar</button><button class="mini" onclick="delAccount('${a.id}')">Eliminar</button></div></div>`).join('')||'<div class="card empty">No hay cuentas. Crea una para empezar.</div>'}</div>`},
 movements(){return `<div class="top"><div><h1>Movimientos</h1><div class="sub">Ingresos, gastos y transferencias</div></div><div class="actions"><button class="btn" onclick="openMovement('expense')">+ Gasto</button><button class="btn green" onclick="openMovement('income')">+ Ingreso</button><button class="btn secondary" onclick="openTransfer()">⇄ Transferencia</button></div></div><div class="card"><div class="filters"><select id="mfType" onchange="filterMov()"><option value="">Todos</option><option value="expense">Gastos</option><option value="income">Ingresos</option><option value="transfer">Transferencias</option></select><select id="mfAccount" onchange="filterMov()"><option value="">Todas las cuentas</option>${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><input class="input" id="mfSearch" placeholder="Buscar concepto, categoría…" oninput="filterMov()"><input class="input" id="mfFrom" type="date" onchange="filterMov()"><input class="input" id="mfTo" type="date" onchange="filterMov()"></div><div id="movementResults">${movementTable(state.movements)}</div></div>`},
 recurring(){return `<div class="top"><div><h1>Recurrentes</h1><div class="sub">Se genera una vez por mes al abrir la aplicación, sin duplicados.</div></div><button class="btn" onclick="openRecurring()">+ Recurrente</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>Concepto</th><th>Tipo</th><th>Importe</th><th>Cuenta</th><th>Día</th><th>Estado</th><th></th></tr></thead><tbody>${state.recurring.map(r=>`<tr><td>${esc(r.concept)}</td><td>${r.type==='income'?'Ingreso':'Gasto'}</td><td>${eur(r.amount)}</td><td>${esc(accName(r.accountId))}</td><td>${r.day}</td><td>${r.active?'Activa':'Inactiva'}</td><td><button class="mini" onclick="toggleRecurring('${r.id}')">${r.active?'Desactivar':'Activar'}</button> <button class="mini" onclick="openRecurring('${r.id}')">Editar</button> <button class="mini" onclick="delRecurring('${r.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin recurrentes.</td></tr>'}</tbody></table></div>`},
 categories(){return `<div class="top"><div><h1>Categorías</h1><div class="sub">Categorías y subcategorías persistentes</div></div><div class="actions"><button class="btn" onclick="openCategory()">+ Categoría</button><button class="btn secondary" onclick="openSubcategory()">+ Subcategoría</button></div></div><div class="two"><div class="card"><h2>Categorías</h2>${state.categories.map(c=>`<div class="row" style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><span><span class="tag">${c.type==='income'?'Ingreso':'Gasto'}</span> ${esc(c.name)}</span><span><button class="mini" onclick="openCategory('${c.id}')">Editar</button> <button class="mini" onclick="delCategory('${c.id}')">Eliminar</button></span></div>`).join('')||'<div class="empty">Sin categorías.</div>'}</div><div class="card"><h2>Subcategorías</h2>${state.subcategories.map(s=>`<div class="row" style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(s.name)} <span class="sub">· ${esc(catName(s.categoryId))}</span></span><span><button class="mini" onclick="openSubcategory('${s.id}')">Editar</button> <button class="mini" onclick="delSubcategory('${s.id}')">Eliminar</button></span></div>`).join('')||'<div class="empty">Sin subcategorías.</div>'}</div></div>`},
 debts(){const pending=state.debts.filter(d=>!d.collected);const total=pending.reduce((s,d)=>s+ +d.amount,0);return `<div class="top"><div><h1>Deudas / Split</h1><div class="sub">Divide gastos, controla lo pendiente y registra cobros.</div></div><button class="btn" onclick="openDebt()">+ Gasto compartido</button></div><div class="grid"><div class="card metric"><div class="label">Pendiente total</div><div class="value negative">${eur(total)}</div></div><div class="card metric"><div class="label">Personas con deuda</div><div class="value">${new Set(pending.map(d=>d.person)).size}</div></div><div class="card metric"><div class="label">Cobrado histórico</div><div class="value positive">${eur(state.collections.reduce((s,x)=>s+ +x.amount,0))}</div></div><div class="card metric"><div class="label">Operaciones</div><div class="value">${state.debts.length}</div></div></div><div class="card section tablewrap"><table class="table"><thead><tr><th>Persona</th><th>Concepto</th><th>Fecha</th><th>Debe</th><th>Estado</th><th></th></tr></thead><tbody>${state.debts.map(d=>`<tr><td>${esc(d.person)}</td><td>${esc(d.concept)}</td><td>${d.date}</td><td>${eur(d.amount)}</td><td>${d.collected?'Cobrado':'Pendiente'}</td><td>${d.collected?'':`<button class="mini" onclick="collectDebt('${d.id}')">Marcar cobrado</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sin deudas.</td></tr>'}</tbody></table></div>`},
 history(){return `<div class="top"><div><h1>Histórico</h1><div class="sub">Busca y filtra todos los movimientos.</div></div><button class="btn secondary" onclick="exportCSV()">Exportar CSV</button></div><div class="card"><div class="filters"><select id="hfType" onchange="filterHist()"><option value="">Todos</option><option value="expense">Gastos</option><option value="income">Ingresos</option></select><select id="hfCat" onchange="filterHist()"><option value="">Todas categorías</option>${state.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><select id="hfAccount" onchange="filterHist()"><option value="">Todas cuentas</option>${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><input class="input" id="hfSearch" placeholder="Buscar texto…" oninput="filterHist()"><input class="input" id="hfFrom" type="date" onchange="filterHist()"><input class="input" id="hfTo" type="date" onchange="filterHist()"></div><div id="histResults"></div></div>`},
 irpf(){return `<div class="top"><div><h1>🧮 IRPF</h1><div class="sub">Calculadora basada literalmente en el código que proporcionaste.</div></div></div><div class="two"><div class="card"><div class="formgrid"><div class="field"><label>Salario bruto anual</label><input class="input" id="irSalary" type="number" step="0.01" value="34474.73"></div><div class="field"><label>Número de pagas</label><select id="irPays"><option>14</option><option>12</option></select></div><div class="field span2"><label>Comunidad autónoma</label><select id="irCom"><option>Extremadura</option><option>Castilla La Mancha</option></select></div></div><button class="btn" style="margin-top:14px" onclick="calcIRPF()">Calcular</button></div><div class="card" id="irResult"><div class="empty">Introduce los datos y pulsa calcular.</div></div></div>`},
 data(){return `<div class="top"><div><h1>Datos / Copias</h1><div class="sub">Todo queda guardado en este navegador.</div></div></div><div class="two"><div class="card"><h2>Exportar</h2><p>Guarda una copia completa JSON o el histórico en CSV.</p><div class="actions"><button class="btn" onclick="exportJSON()">📤 Copia completa</button><button class="btn secondary" onclick="exportCSV()">📄 CSV</button></div></div><div class="card"><h2>Importar</h2><p>Restaura una copia JSON anterior.</p><input id="importFile" type="file" accept="application/json"><button class="btn" style="margin-top:10px" onclick="importJSON()">📥 Restaurar</button></div></div><div class="card section"><h2>Zona de seguridad</h2><p class="sub">Borrar todos los datos es irreversible en este navegador. Exporta una copia antes.</p><button class="btn danger" onclick="resetAll()">Borrar todos los datos</button></div>`}
};
function movementTable(ms){if(!ms.length)return '<div class="empty">No hay movimientos.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Categoría</th><th>Cuenta</th><th class="right">Importe</th><th></th></tr></thead><tbody>${ms.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<tr><td>${m.date}</td><td>${esc(m.concept)}</td><td>${m.type==='income'?'Ingreso':m.type==='expense'?'Gasto':'Transferencia'}</td><td>${esc(m.category||'—')}</td><td>${esc(m.type==='transfer'?accName(m.from)+' → '+accName(m.to):accName(m.accountId))}</td><td class="right ${m.type==='income'?'positive':m.type==='expense'?'negative':''}">${m.type==='expense'?'-':m.type==='income'?'+':''}${eur(m.amount)}</td><td class="row-actions"><button class="mini" onclick="openMovement('${m.type}','${m.id}')">Editar</button><button class="mini" onclick="delMovement('${m.id}')">Borrar</button></td></tr>`).join('')}</tbody></table></div>`}
function accName(id){return state.accounts.find(a=>a.id===id)?.name||'—'}function catName(id){return state.categories.find(c=>c.id===id)?.name||'—'}
function openModal(title,html,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show');modalSaveFn=fn;document.getElementById('modalSave').onclick=()=>{try{fn()}catch(e){console.error(e);alert('No se pudo guardar: '+e.message)}}}function closeModal(){document.getElementById('modal').classList.remove('show');modalSaveFn=null}
function openAccount(id=''){const a=state.accounts.find(x=>x.id===id)||{name:'',initial:0};openModal(id?'Editar cuenta':'Nueva cuenta',`<div class="formgrid"><div class="field span2"><label>Nombre</label><input class="input" id="fName" value="${esc(a.name)}"></div><div class="field span2"><label>Saldo inicial</label><input class="input" id="fInitial" type="number" step="0.01" value="${a.initial}"></div></div>`,()=>{const name=document.getElementById('fName').value.trim();if(!name)throw Error('Escribe un nombre');const initial=+document.getElementById('fInitial').value||0;if(id)Object.assign(a,{name,initial});else state.accounts.push({id:uid(),name,initial});save();closeModal();render()})}
function delAccount(id){if(state.movements.some(m=>m.accountId===id||m.from===id||m.to===id))return alert('No puedes borrar una cuenta con movimientos asociados.');if(confirm('¿Eliminar cuenta?')){state.accounts=state.accounts.filter(a=>a.id!==id);save();render()}}
function openMovement(type,id=''){const m=state.movements.find(x=>x.id===id)||{date:today(),concept:'',amount:'',accountId:state.accounts[0]?.id||'',category:state.categories.find(c=>c.type===type)?.name||'',subcategory:''};const cats=state.categories.filter(c=>c.type===type);openModal(id?'Editar movimiento':type==='income'?'Nuevo ingreso':'Nuevo gasto',`<div class="formgrid"><div class="field"><label>Fecha</label><input class="input" id="fDate" type="date" value="${m.date}"></div><div class="field"><label>Importe</label><input class="input" id="fAmount" type="number" min="0" step="0.01" value="${m.amount}"></div><div class="field"><label>Cuenta</label><select id="fAccount">${state.accounts.map(a=>`<option value="${a.id}" ${a.id===m.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Categoría</label><select id="fCat"><option value="">Sin categoría</option>${cats.map(c=>`<option ${c.name===m.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Subcategoría</label><select id="fSub"><option value="">Sin subcategoría</option>${state.subcategories.filter(s=>s.categoryId===cats.find(c=>c.name===m.category)?.id).map(s=>`<option ${s.name===m.subcategory?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field span2"><label>Descripción / concepto</label><input class="input" id="fConcept" value="${esc(m.concept)}"></div></div>`,()=>{if(!state.accounts.length)throw Error('Crea una cuenta primero');const data={date:document.getElementById('fDate').value,amount:+document.getElementById('fAmount').value,accountId:document.getElementById('fAccount').value,category:document.getElementById('fCat').value,subcategory:document.getElementById('fSub').value,concept:document.getElementById('fConcept').value.trim(),type};if(data.amount<=0)throw Error('El importe debe ser mayor que 0');if(!data.concept)throw Error('Escribe un concepto');if(id)Object.assign(m,data);else state.movements.push({id:uid(),...data});save();closeModal();render()})}
function openTransfer(){if(state.accounts.length<2)return alert('Necesitas al menos dos cuentas.');openModal('Nueva transferencia',`<div class="formgrid"><div class="field"><label>Fecha</label><input class="input" id="tDate" type="date" value="${today()}"></div><div class="field"><label>Importe</label><input class="input" id="tAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Desde</label><select id="tFrom">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Hacia</label><select id="tTo">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field span2"><label>Concepto</label><input class="input" id="tConcept" value="Transferencia entre cuentas"></div></div>`,()=>{const from=document.getElementById('tFrom').value,to=document.getElementById('tTo').value,amount=+document.getElementById('tAmount').value;if(from===to)throw Error('Las cuentas deben ser distintas');if(amount<=0)throw Error('Importe inválido');state.movements.push({id:uid(),type:'transfer',date:document.getElementById('tDate').value,amount,from,to,concept:document.getElementById('tConcept').value});save();closeModal();render()})}
function delMovement(id){if(confirm('¿Borrar movimiento?')){state.movements=state.movements.filter(m=>m.id!==id);save();render()}}
function openRecurring(id=''){const r=state.recurring.find(x=>x.id===id)||{concept:'',amount:'',type:'expense',accountId:state.accounts[0]?.id||'',category:state.categories.find(c=>c.type==='expense')?.name||'',subcategory:'',day:1,active:true};openModal(id?'Editar recurrente':'Nuevo recurrente',`<div class="formgrid"><div class="field span2"><label>Concepto</label><input class="input" id="rConcept" value="${esc(r.concept)}"></div><div class="field"><label>Importe</label><input class="input" id="rAmount" type="number" step="0.01" value="${r.amount}"></div><div class="field"><label>Tipo</label><select id="rType"><option value="expense" ${r.type==='expense'?'selected':''}>Gasto</option><option value="income" ${r.type==='income'?'selected':''}>Ingreso</option></select></div><div class="field"><label>Cuenta</label><select id="rAccount">${state.accounts.map(a=>`<option value="${a.id}" ${a.id===r.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Día del mes</label><input class="input" id="rDay" type="number" min="1" max="31" value="${r.day}"></div><div class="field span2"><label>Categoría</label><input class="input" id="rCat" value="${esc(r.category)}"></div></div>`,()=>{const x={concept:document.getElementById('rConcept').value.trim(),amount:+document.getElementById('rAmount').value,type:document.getElementById('rType').value,accountId:document.getElementById('rAccount').value,category:document.getElementById('rCat').value.trim(),day:Math.min(31,Math.max(1,+document.getElementById('rDay').value||1)),active:true};if(!x.concept||x.amount<=0)throw Error('Concepto e importe son obligatorios');if(id)Object.assign(r,x);else state.recurring.push({id:uid(),...x,active:true});save();closeModal();render()})}
function toggleRecurring(id){const r=state.recurring.find(x=>x.id===id);r.active=!r.active;save();render()}function delRecurring(id){if(confirm('¿Eliminar recurrente?')){state.recurring=state.recurring.filter(x=>x.id!==id);save();render()}}
function generateRecurring(){const now=new Date(),ym=today().slice(0,7),day=now.getDate();if(state.settings.lastRecurringRun===ym&&state.settings.lastRecurringDay===day)return;let changed=false;state.recurring.filter(r=>r.active&&day>=r.day).forEach(r=>{const key=`recurring:${r.id}:${ym}`;if(!state.movements.some(m=>m.recurringKey===key)){state.movements.push({id:uid(),type:r.type,date:`${ym}-${String(Math.min(r.day,new Date(now.getFullYear(),now.getMonth()+1,0).getDate())).padStart(2,'0')}`,amount:r.amount,accountId:r.accountId,category:r.category,subcategory:r.subcategory||'',concept:r.concept,recurringKey:key});changed=true}});state.settings.lastRecurringRun=ym;state.settings.lastRecurringDay=day;if(changed)save();else localStorage.setItem(KEY,JSON.stringify(state))}
function openCategory(id=''){const c=state.categories.find(x=>x.id===id)||{name:'',type:'expense'};openModal(id?'Editar categoría':'Nueva categoría',`<div class="formgrid"><div class="field"><label>Nombre</label><input class="input" id="cName" value="${esc(c.name)}"></div><div class="field"><label>Tipo</label><select id="cType"><option value="expense" ${c.type==='expense'?'selected':''}>Gasto</option><option value="income" ${c.type==='income'?'selected':''}>Ingreso</option></select></div></div>`,()=>{const name=document.getElementById('cName').value.trim();if(!name)throw Error('Nombre obligatorio');if(id)Object.assign(c,{name,type:document.getElementById('cType').value});else state.categories.push({id:uid(),name,type:document.getElementById('cType').value});save();closeModal();render()})}
function delCategory(id){const c=state.categories.find(x=>x.id===id);if(state.movements.some(m=>m.category===c.name)||state.recurring.some(r=>r.category===c.name))return alert('No se puede eliminar: hay movimientos/recurrentes que la usan.');if(confirm('¿Eliminar categoría?')){state.categories=state.categories.filter(x=>x.id!==id);save();render()}}
function openSubcategory(id=''){const s=state.subcategories.find(x=>x.id===id)||{name:'',categoryId:state.categories[0]?.id||''};openModal(id?'Editar subcategoría':'Nueva subcategoría',`<div class="formgrid"><div class="field"><label>Nombre</label><input class="input" id="sName" value="${esc(s.name)}"></div><div class="field"><label>Categoría</label><select id="sCat">${state.categories.map(c=>`<option value="${c.id}" ${c.id===s.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>`,()=>{const name=document.getElementById('sName').value.trim();if(!name)throw Error('Nombre obligatorio');if(id)Object.assign(s,{name,categoryId:document.getElementById('sCat').value});else state.subcategories.push({id:uid(),name,categoryId:document.getElementById('sCat').value});save();closeModal();render()})}
function delSubcategory(id){if(confirm('¿Eliminar subcategoría?')){state.subcategories=state.subcategories.filter(x=>x.id!==id);save();render()}}
function openPerson(id=''){const p=state.people.find(x=>x.id===id)||{name:''};openModal(id?'Editar persona':'Nueva persona',`<div class="field"><label>Nombre</label><input class="input" id="pName" value="${esc(p.name)}"></div>`,()=>{const name=document.getElementById('pName').value.trim();if(!name)throw Error('Nombre obligatorio');if(id)Object.assign(p,{name});else state.people.push({id:uid(),name});save();closeModal();render()})}
function delPerson(id){if(state.debts.some(d=>d.personId===id)){return alert('No puedes eliminar una persona con deudas asociadas.')}if(confirm('¿Eliminar persona?')){state.people=state.people.filter(p=>p.id!==id);save();render()}}
function openDebt(){if(!state.accounts.length)return alert('Crea una cuenta primero.');if(!state.people.length)return alert('Crea al menos una persona primero.');const people=state.people;openModal('Gasto compartido / Split',`<div class="formgrid"><div class="field"><label>Fecha</label><input class="input" id="dDate" type="date" value="${today()}"></div><div class="field"><label>Gasto total</label><input class="input" id="dTotal" type="number" min="0" step="0.01"></div><div class="field"><label>Tu cuenta</label><select id="dAccount">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Concepto</label><input class="input" id="dConcept"></div><div class="field span2"><label>Personas que te deben</label><select id="dPerson" multiple size="${Math.min(6,people.length)}">${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="sub" style="margin-top:5px">Mantén pulsado Ctrl/Cmd para seleccionar varias. Se dividirá automáticamente a partes iguales.</div></div><div class="field span2"><label>O reparto personalizado (una línea: Persona=importe)</label><textarea class="input" id="dCustom" rows="4" placeholder="Ana=20\nLuis=15"></textarea></div></div>`,()=>{const total=+document.getElementById('dTotal').value;const custom=document.getElementById('dCustom').value.split('\n').map(x=>x.trim()).filter(Boolean);let shares=[];if(custom.length){shares=custom.map(x=>{const [name,amt]=x.split('=');const person=people.find(p=>p.name.toLowerCase()===name.trim().toLowerCase());if(!person)throw Error('Persona no encontrada: '+name.trim());return {personId:person.id,person:person.name,amount:+amt}})}else{const ids=[...document.getElementById('dPerson').selectedOptions].map(o=>o.value);if(!ids.length)throw Error('Selecciona al menos una persona');const share=+(total/ids.length).toFixed(2);shares=ids.map((id,i)=>{const person=people.find(p=>p.id===id);return {personId:id,person:person.name,amount:i===ids.length-1?+(total-share*(ids.length-1)).toFixed(2):share}})}const sum=shares.reduce((s,x)=>s+x.amount,0);if(total<=0||Math.abs(sum-total)>0.02)throw Error('El total y las partes no cuadran');const concept=document.getElementById('dConcept').value.trim()||'Gasto compartido';state.movements.push({id:uid(),type:'expense',date:document.getElementById('dDate').value,amount:total,accountId:document.getElementById('dAccount').value,category:'Compartido',concept});shares.forEach(x=>state.debts.push({id:uid(),date:document.getElementById('dDate').value,personId:x.personId,person:x.person,amount:x.amount,concept,collected:false}));save();closeModal();render()})}
function collectDebt(id){const d=state.debts.find(x=>x.id===id);if(!d||d.collected)return;if(!state.accounts.length)return alert('Crea una cuenta para registrar el cobro.');openModal('Registrar cobro',`<div class="formgrid"><div class="field span2"><label>Cuenta donde entra el dinero</label><select id="coAccount">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div></div><p>${esc(d.person)} te debe <b>${eur(d.amount)}</b>.</p>`,()=>{d.collected=true;state.collections.push({id:uid(),debtId:d.id,person:d.person,amount:d.amount,date:today(),accountId:document.getElementById('coAccount').value});state.movements.push({id:uid(),type:'income',date:today(),amount:d.amount,accountId:document.getElementById('coAccount').value,category:'Deudas cobradas',concept:'Cobro de '+d.person});save();closeModal();render()})}
function filterMov(){const t=document.getElementById('mfType').value,a=document.getElementById('mfAccount').value,q=document.getElementById('mfSearch').value.toLowerCase(),f=document.getElementById('mfFrom').value,to=document.getElementById('mfTo').value;const ms=state.movements.filter(m=>(!t||m.type===t)&&(!a||(m.type==='transfer'?(m.from===a||m.to===a):m.accountId===a))&&(!q||(m.concept+' '+(m.category||'')+' '+(m.subcategory||'')).toLowerCase().includes(q))&&(!f||m.date>=f)&&(!to||m.date<=to));document.getElementById('movementResults').innerHTML=movementTable(ms)}
function filterHist(){const t=document.getElementById('hfType').value,c=document.getElementById('hfCat').value,a=document.getElementById('hfAccount').value,q=document.getElementById('hfSearch').value.toLowerCase(),f=document.getElementById('hfFrom').value,to=document.getElementById('hfTo').value;const ms=state.movements.filter(m=>(m.type==='income'||m.type==='expense')&&(!t||m.type===t)&&(!c||m.category===c)&&(!a||m.accountId===a)&&(!q||(m.concept+' '+(m.category||'')+' '+(m.subcategory||'')).toLowerCase().includes(q))&&(!f||m.date>=f)&&(!to||m.date<=to));const tt=totals(ms);document.getElementById('histResults').innerHTML=`<div class="grid" style="margin-bottom:14px"><div class="card metric"><div class="label">Ingresos filtrados</div><div class="value positive">${eur(tt.i)}</div></div><div class="card metric"><div class="label">Gastos filtrados</div><div class="value negative">${eur(tt.e)}</div></div><div class="card metric"><div class="label">Balance</div><div class="value">${eur(tt.i-tt.e)}</div></div><div class="card metric"><div class="label">Movimientos</div><div class="value">${ms.length}</div></div></div>${movementTable(ms)}`}
function csvEscape(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function exportCSV(){const rows=[['Fecha','Tipo','Concepto','Importe','Cuenta','Categoría','Subcategoría'],...state.movements.map(m=>[m.date,m.type,m.concept,m.amount,m.type==='transfer'?accName(m.from)+' -> '+accName(m.to):accName(m.accountId),m.category||'',m.subcategory||''])];download('finanzas-historico.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(csvEscape).join(';')).join('\n'))}
function exportJSON(){download('finanzas-backup.json','application/json',JSON.stringify(state,null,2))}function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(){const f=document.getElementById('importFile').files[0];if(!f)return alert('Selecciona un archivo JSON.');const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.accounts||!x.movements)throw Error('Copia no válida');state={...defaultState,...x,settings:{...defaultState.settings,...(x.settings||{})}};save();render();toast('Copia restaurada')}catch(e){alert('No se pudo importar: '+e.message)}};r.readAsText(f)}
function resetAll(){if(confirm('¿Borrar TODOS los datos?')){localStorage.removeItem(KEY);state=load();render();toast('Datos borrados')}}
function calcIRPF(){const s=+document.getElementById('irSalary').value,p=+document.getElementById('irPays').value,c=document.getElementById('irCom').value;const ss=s*.065, minE=5550*.095,minC=c==='Extremadura'?5550*.0775:5550*.095,b=s-ss-2000;function est(x){if(x<=12450)return x*.095;if(x<=20200)return (x-12450)*.12+12450*.095;if(x<=35200)return (x-20200)*.15+(20200-12450)*.12+12450*.095;if(x<=60000)return (x-35200)*.185+(35200-20200)*.15+(20200-12450)*.12+12450*.095;if(x<=300000)return (x-60000)*.225+(60000-35200)*.185+(35200-20200)*.15+(20200-12450)*.12+12450*.095;return (x-300000)*.245+(300000-60000)*.225+(60000-35200)*.185+(35200-20200)*.15+(20200-12450)*.12+12450*.095}function ext(x){if(c!=='Extremadura')return est(x);if(x<=12450)return x*.0775;if(x<=20200)return (x-12450)*.0975+12450*.0775;if(x<=24200)return (x-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=35200)return (x-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=60000)return (x-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=80200)return (x-60000)*.235+(60000-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=99200)return (x-80200)*.24+(80200-60000)*.235+(60000-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=120200)return (x-99200)*.245+(99200-80200)*.24+(80200-60000)*.235+(60000-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;return (x-120200)*.25+(120200-99200)*.245+(99200-80200)*.24+(80200-60000)*.235+(60000-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775}const ie=est(b),ic=ext(b),it=ie+ic-minE-minC,net=s-(ss+ie+ic-minE-minC),pct=it/s*100,ordinary=p===14?((s-ie-ic+minE+minC)/14)-(ss/12):net/12,extra=p===14?(s-ie-ic+minE+minC)/14:null;document.getElementById('irResult').innerHTML=`<h2>Resultado</h2><div class="grid"><div class="metric"><div class="label">IRPF aplicado</div><div class="value">${pct.toFixed(2)}%</div></div><div class="metric"><div class="label">Neto anual</div><div class="value positive">${eur(net)}</div></div><div class="metric"><div class="label">Paga ordinaria</div><div class="value">${eur(ordinary)}</div></div><div class="metric"><div class="label">Paga extra</div><div class="value">${extra==null?'—':eur(extra)}</div></div></div><p class="sub">Seguridad Social: ${eur(ss)} · Base imponible: ${eur(b)} · IRPF estatal: ${eur(ie)} · IRPF comunidad: ${eur(ic)}</p>`}
function init(){nav();render();if(page==='history')filterHist();if(page==='movements')filterMov()}
init();
</script></body></html>
