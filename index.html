<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finanzas</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18202a;--muted:#718096;--line:#e5e9f0;--primary:#315efb;--green:#15966b;--red:#df4f5f;--dark:#111827}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:240px;background:var(--dark);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:800;padding:0 12px 24px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#253047;color:#fff}.main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:var(--primary);color:#fff;padding:10px 14px;border-radius:9px;font-weight:700}.btn.secondary{background:#e9eefc;color:#2947b9}.btn.danger{background:#fee2e2;color:#b4232f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #18202a08}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:25px;font-weight:800;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 12px}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.toolbar input{min-width:220px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}.form .full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#11182788;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.open{display:flex}.modalbox{background:#fff;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#f1f3f6;border-radius:8px;padding:7px 10px}.empty{padding:30px;text-align:center;color:var(--muted)}.account{display:flex;justify-content:space-between;align-items:center}.small{font-size:12px;color:var(--muted)}.hidden{display:none}.danger-text{color:var(--red)}@media(max-width:900px){.side{width:76px}.brand{font-size:0}.brand:after{content:'€';font-size:25px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-left:76px;width:calc(100% - 76px);padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.main{padding:12px}.top{align-items:flex-start;gap:10px;flex-direction:column}.side{width:64px;padding:15px 8px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Finanzas</div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><h1 id="title">Resumen</h1><div class="actions"><button class="btn" onclick="openMovement('expense')">+ Gasto</button><button class="btn secondary" onclick="openMovement('income')">+ Ingreso</button></div></div><div id="view"></div></main></div><div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><script>
const KEY='finanzas_static_v1';
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{accounts:[],movements:[],recurring:[],categories:[{id:'alimentacion',name:'Alimentación',type:'expense',subs:['Supermercado','Restaurantes','Comida a domicilio']},{id:'transporte',name:'Transporte',type:'expense',subs:['Combustible','Mantenimiento','Seguro','Parking']},{id:'vivienda',name:'Vivienda',type:'expense',subs:[]},{id:'ocio',name:'Ocio',type:'expense',subs:[]},{id:'salud',name:'Salud',type:'expense',subs:[]},{id:'salario',name:'Salario',type:'income',subs:[]}],debts:[],settings:{}};
let page='dashboard', editId=null; const save=()=>localStorage.setItem(KEY,JSON.stringify(state)); const uid=()=>crypto.randomUUID(); const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navItems=[['dashboard','🏠 Resumen'],['accounts','💳 Cuentas'],['movements','💸 Movimientos'],['recurring','🔄 Recurrentes'],['categories','🗂️ Categorías'],['debts','🤝 Deudas / Split'],['history','📊 Histórico'],['irpf','🧮 IRPF'],['data','💾 Datos / Copias']];
function renderNav(){nav.innerHTML=navItems.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){page=p;renderNav();render()}
function totals(ms=state.movements){return {income:ms.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),expense:ms.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)}}
function render(){title.textContent=navItems.find(x=>x[0]===page)?.[1].replace(/^\S+ /,'')||''; const fn={dashboard:dashboard,accounts:accounts,movements:movements,recurring:recurring,categories:categories,debts:debts,history:history,irpf:irpf,data:data}[page];view.innerHTML=fn(); if(page==='dashboard') drawChart();}
function dashboard(){const t=totals();const bal=state.accounts.reduce((a,c)=>a+c.balance,0);return `<div class="grid"><div class="card metric"><div class="label">Saldo total</div><div class="value">${eur(bal)}</div></div><div class="card metric"><div class="label">Ingresos</div><div class="value green">${eur(t.income)}</div></div><div class="card metric"><div class="label">Gastos</div><div class="value red">${eur(t.expense)}</div></div><div class="card metric"><div class="label">Balance</div><div class="value">${eur(t.income-t.expense)}</div></div></div><div class="twocol section"><div class="card"><h2>Últimos movimientos</h2>${movementTable(state.movements.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div><div class="card"><h2>Gastos por categoría</h2><canvas id="chart"></canvas></div></div>`}
function movementTable(ms){if(!ms.length)return '<div class="empty">No hay movimientos todavía.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>Categoría</th><th>Cuenta</th><th>Importe</th><th></th></tr></thead><tbody>${ms.map(m=>`<tr><td>${esc(m.date)}</td><td>${m.type==='income'?'<span class="green">Ingreso</span>':'<span class="red">Gasto</span>'}</td><td>${esc(m.description||'—')}</td><td>${esc(catName(m.category))}</td><td>${esc(accName(m.accountId))}</td><td class="${m.type==='income'?'green':'red'}">${m.type==='income'?'+':'−'}${eur(m.amount)}</td><td><button class="close" onclick="editMovement('${m.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function accounts(){return `<div class="actions section"><button class="btn" onclick="openAccount()">+ Nueva cuenta</button></div><div class="grid section">${state.accounts.map(a=>`<div class="card account"><div><b>${esc(a.name)}</b><div class="small">Saldo inicial ${eur(a.initial)}</div></div><div><b>${eur(a.balance)}</b><br><button class="close" onclick="deleteAccount('${a.id}')">Eliminar</button></div></div>`).join('')||'<div class="card empty">Crea tu primera cuenta.</div>'}</div>`}
function movements(){return `<div class="toolbar"><input id="msearch" placeholder="Buscar…" oninput="renderMoveRows()"><select id="mtype" onchange="renderMoveRows()"><option value="">Todos</option><option value="expense">Gastos</option><option value="income">Ingresos</option></select></div><div class="card" id="mrows"></div>`}
function renderMoveRows(){let q=(msearch.value||'').toLowerCase(),t=mtype.value;let ms=state.movements.filter(m=>(!t||m.type===t)&&(`${m.description} ${catName(m.category)} ${m.subcategory||''}`.toLowerCase().includes(q)));mrows.innerHTML=movementTable(ms)}
function recurring(){return `<div class="actions section"><button class="btn" onclick="openRecurring()">+ Nuevo recurrente</button></div><div class="card section"><table class="table"><thead><tr><th>Concepto</th><th>Tipo</th><th>Importe</th><th>Día</th><th>Cuenta</th><th>Activo</th><th></th></tr></thead><tbody>${state.recurring.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.type==='income'?'Ingreso':'Gasto'}</td><td>${eur(r.amount)}</td><td>${r.day}</td><td>${esc(accName(r.accountId))}</td><td>${r.active?'Sí':'No'}</td><td><button class="close" onclick="toggleRecurring('${r.id}')">${r.active?'Desactivar':'Activar'}</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin recurrentes.</td></tr>'}</tbody></table></div>`}
function categories(){return `<div class="actions section"><button class="btn" onclick="openCategory()">+ Nueva categoría</button></div><div class="grid section">${state.categories.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="small">${c.type==='income'?'Ingresos':'Gastos'} · ${c.subs.length} subcategorías</div><div style="margin-top:8px">${c.subs.map(s=>`<span class="pill">${esc(s)}</span>`).join(' ')||'<span class="small">Sin subcategorías</span>'}</div></div>`).join('')}</div>`}
function debts(){let pending=state.debts.filter(d=>!d.paid);return `<div class="grid"><div class="card metric"><div class="label">Pendiente de cobrar</div><div class="value">${eur(pending.reduce((a,d)=>a+d.amount,0))}</div></div><div class="card metric"><div class="label">Personas</div><div class="value">${new Set(pending.map(d=>d.person)).size}</div></div></div><div class="actions section"><button class="btn" onclick="openDebt()">+ Añadir deuda</button></div><div class="card section"><table class="table"><thead><tr><th>Persona</th><th>Importe</th><th>Gasto</th><th>Estado</th><th></th></tr></thead><tbody>${state.debts.map(d=>`<tr><td>${esc(d.person)}</td><td>${eur(d.amount)}</td><td>${esc(d.description||'')}</td><td>${d.paid?'Cobrado':'Pendiente'}</td><td>${!d.paid?`<button class="btn secondary" onclick="collectDebt('${d.id}')">Marcar cobrada</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No hay deudas.</td></tr>'}</tbody></table></div>`}
function history(){return `<div class="toolbar"><input type="date" id="from" onchange="renderHistory()"><input type="date" id="to" onchange="renderHistory()"><select id="htype" onchange="renderHistory()"><option value="">Todos</option><option value="expense">Gastos</option><option value="income">Ingresos</option></select><select id="hcat" onchange="renderHistory()"><option value="">Categoría</option>${state.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="hsearch" placeholder="Buscar…" oninput="renderHistory()"></div><div id="hbox"></div>`}
function renderHistory(){let ms=filtered();let t=totals(ms);hbox.innerHTML=`<div class="grid"><div class="card metric"><div class="label">Ingresos</div><div class="value green">${eur(t.income)}</div></div><div class="card metric"><div class="label">Gastos</div><div class="value red">${eur(t.expense)}</div></div><div class="card metric"><div class="label">Balance</div><div class="value">${eur(t.income-t.expense)}</div></div></div><div class="card section">${movementTable(ms)}</div>`}
function filtered(){let f=from.value,toV=to.value,t=htype.value,c=hcat.value,q=(hsearch.value||'').toLowerCase();return state.movements.filter(m=>(!f||m.date>=f)&&(!toV||m.date<=toV)&&(!t||m.type===t)&&(!c||m.category===c)&&(`${m.description} ${m.subcategory||''} ${catName(m.category)}`.toLowerCase().includes(q)))}
function irpf(){return `<div class="card form"><div class="formgrid"><label>Salario bruto anual<input id="rb" type="number" step="0.01" value="33470.61"></label><label>Número de pagas<select id="rp"><option>14</option><option>12</option></select></label><label>Comunidad<select id="rc"><option>Extremadura</option><option>Castilla La Mancha</option></select></label></div><button class="btn section" onclick="calcIRPF()">Calcular</button><div id="irpfResult" class="section"></div></div>`}
function calcIRPF(){let s=+rb.value,p=+rp.value,c=rc.value,ss=s*.065,base=s-ss-2000;const est=x=>x<=12450?x*.095:x<=20200?12450*.095+(x-12450)*.12:x<=35200?12450*.095+7750*.12+(x-20200)*.15:x<=60000?12450*.095+7750*.12+15000*.15+(x-35200)*.185:x<=300000?12450*.095+7750*.12+15000*.15+24800*.185+(x-60000)*.225:12450*.095+7750*.12+15000*.15+24800*.185+240000*.225+(x-300000)*.245;const ext=x=>x<=12450?x*.0775:x<=20200?12450*.0775+(x-12450)*.0975:x<=24200?12450*.0775+7750*.0975+(x-20200)*.16:x<=35200?12450*.0775+7750*.0975+4000*.16+(x-24200)*.175:x<=60000?12450*.0775+7750*.0975+4000*.16+11000*.175+(x-35200)*.21:x<=80200?12450*.0775+7750*.0975+4000*.16+11000*.175+24800*.21+(x-60000)*.235:x<=99200?12450*.0775+7750*.0975+4000*.16+11000*.175+24800*.21+20200*.235+(x-80200)*.24:x<=120200?12450*.0775+7750*.0975+4000*.16+11000*.175+24800*.21+20200*.235+19000*.24+(x-99200)*.245:12450*.0775+7750*.0975+4000*.16+11000*.175+24800*.21+20200*.235+19000*.24+31000*.245+(x-120200)*.25;const clm=x=>x<=12450?x*.095:x<=20200?12450*.095+(x-12450)*.12:x<=35200?12450*.095+7750*.12+(x-20200)*.15:x<=60000?12450*.095+7750*.12+15000*.15+(x-35200)*.185:12450*.095+7750*.12+15000*.15+24800*.185+(x-60000)*.225;let ie=est(base),ic=c==='Extremadura'?ext(base):clm(base),minE=5550*.095,minC=5550*(c==='Extremadura'?.0775:.095),total=ie+ic-minE-minC,net=s-(ss+ie+ic-minE-minC),pct=total/s*100;let normal=p===14?net/14:ss/12?((s-ie-ic+minE+minC)/14-ss/12):net/12;let extra=p===14?(s-ie-ic+minE+minC)/14:null;irpfResult.innerHTML=`<div class="grid"><div class="card metric"><div class="label">Neto anual</div><div class="value">${eur(net)}</div></div><div class="card metric"><div class="label">Neto paga ordinaria</div><div class="value">${eur(normal)}</div></div><div class="card metric"><div class="label">IRPF aplicado</div><div class="value">${pct.toFixed(2)}%</div></div>${extra!==null?`<div class="card metric"><div class="label">Neto paga extra</div><div class="value">${eur(extra)}</div></div>`:''}</div>`}
function data(){return `<div class="card"><h2>Copias y exportación</h2><p class="small">Todos los datos se guardan en este navegador mediante localStorage.</p><div class="actions"><button class="btn" onclick="exportJSON()">Exportar copia completa</button><button class="btn secondary" onclick="exportCSV()">Exportar CSV</button><label class="btn secondary">Importar copia<input type="file" accept="application/json" hidden onchange="importJSON(event)"></label></div></div>`}
function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.add('open')}function closeModal(){modal.classList.remove('open');editId=null}
function catName(id){return state.categories.find(c=>c.id===id)?.name||id||'—'}function accName(id){return state.accounts.find(a=>a.id===id)?.name||'—'}
function openAccount(){openModal('Nueva cuenta',`<div class="form"><label>Nombre<input id="an"></label><label>Saldo inicial<input id="ai" type="number" step="0.01"></label><button class="btn section" onclick="addAccount()">Guardar</button></div>`)}function addAccount(){let a={id:uid(),name:an.value,initial:+ai.value||0,balance:+ai.value||0};state.accounts.push(a);save();closeModal();render()}
function deleteAccount(id){if(state.movements.some(m=>m.accountId===id))return alert('No puedes eliminar una cuenta con movimientos asociados.');state.accounts=state.accounts.filter(a=>a.id!==id);save();render()}
function openMovement(type,id=null){editId=id;let m=id?state.movements.find(x=>x.id===id):{type,amount:'',date:new Date().toISOString().slice(0,10),accountId:state.accounts[0]?.id||'',category:state.categories.find(c=>c.type===type)?.id||'',subcategory:'',description:''};openModal(id?'Editar movimiento':type==='expense'?'Nuevo gasto':'Nuevo ingreso',`<div class="form"><div class="formgrid"><label>Importe<input id="ma" type="number" step="0.01" value="${m.amount}"></label><label>Fecha<input id="md" type="date" value="${m.date}"></label><label>Cuenta<select id="macc">${state.accounts.map(a=>`<option value="${a.id}" ${a.id===m.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label>Categoría<select id="mcat">${state.categories.filter(c=>c.type===m.type).map(c=>`<option value="${c.id}" ${c.id===m.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Subcategoría<input id="msub" value="${esc(m.subcategory||'')}"></label><label>Descripción<input id="mdesc" value="${esc(m.description||'')}"></label></div><button class="btn section" onclick="saveMovement('${m.type}')">Guardar</button></div>`)}function editMovement(id){openMovement(state.movements.find(m=>m.id===id).type,id)}
function saveMovement(type){let amount=+ma.value||0;if(!amount||!macc.value)return alert('Completa importe y cuenta.');if(editId){let m=state.movements.find(x=>x.id===editId);state.accounts.find(a=>a.id===m.accountId).balance+=m.type==='income'?-m.amount:m.amount;Object.assign(m,{amount,date:md.value,accountId:macc.value,category:mcat.value,subcategory:msub.value,description:mdesc.value});state.accounts.find(a=>a.id===m.accountId).balance+=type==='income'?amount:-amount}else{let m={id:uid(),type,amount,date:md.value,accountId:macc.value,category:mcat.value,subcategory:msub.value,description:mdesc.value};state.movements.push(m);state.accounts.find(a=>a.id===m.accountId).balance+=type==='income'?amount:-amount}save();closeModal();render()}
function openRecurring(){openModal('Nuevo recurrente',`<div class="form"><div class="formgrid"><label>Concepto<input id="rn"></label><label>Importe<input id="ra" type="number" step="0.01"></label><label>Tipo<select id="rt"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></label><label>Día del mes<input id="rd" type="number" min="1" max="31" value="1"></label><label>Cuenta<select id="racc">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label><label>Categoría<select id="rcat">${state.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div><button class="btn section" onclick="addRecurring()">Guardar</button></div>`)}function addRecurring(){state.recurring.push({id:uid(),name:rn.value,amount:+ra.value,type:rt.value,day:+rd.value,accountId:racc.value,category:rcat.value,active:true,lastGenerated:null});save();closeModal();render()}function toggleRecurring(id){let r=state.recurring.find(x=>x.id===id);r.active=!r.active;save();render()}
function openCategory(){openModal('Nueva categoría',`<div class="form"><label>Nombre<input id="cn"></label><label>Tipo<select id="ct"><option value="expense">Gastos</option><option value="income">Ingresos</option></select></label><label>Subcategorías, separadas por coma<input id="cs"></label><button class="btn section" onclick="addCategory()">Guardar</button></div>`)}function addCategory(){state.categories.push({id:uid(),name:cn.value,type:ct.value,subs:cs.value.split(',').map(x=>x.trim()).filter(Boolean)});save();closeModal();render()}
function openDebt(){openModal('Nueva deuda',`<div class="form"><div class="formgrid"><label>Persona<input id="dp"></label><label>Importe que debe<input id="da" type="number" step="0.01"></label><label class="full">Concepto<input id="dd"></label></div><button class="btn section" onclick="addDebt()">Guardar</button></div>`)}function addDebt(){state.debts.push({id:uid(),person:dp.value,amount:+da.value,description:dd.value,paid:false});save();closeModal();render()}function collectDebt(id){let d=state.debts.find(x=>x.id===id);d.paid=true;let acc=state.accounts[0];if(acc){let cat=state.categories.find(c=>c.type==='income')?.id;state.movements.push({id:uid(),type:'income',amount:d.amount,date:new Date().toISOString().slice(0,10),accountId:acc.id,category:cat,subcategory:'',description:`Cobro deuda: ${d.person}`});acc.balance+=d.amount}save();render()}
function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});downloadBlob(blob,'finanzas-copia.json')}function exportCSV(){let rows=[['fecha','tipo','importe','cuenta','categoria','subcategoria','descripcion'],...state.movements.map(m=>[m.date,m.type,m.amount,accName(m.accountId),catName(m.category),m.subcategory||'',m.description||''])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'finanzas-historico.csv')}function downloadBlob(b,n){let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.accounts||!x.movements)throw 0;Object.assign(state,x);save();render();alert('Copia restaurada.')}catch{alert('Archivo no válido.')}};r.readAsText(f)}
function drawChart(){let el=document.getElementById('chart');if(!el)return;let map={};state.movements.filter(m=>m.type==='expense').forEach(m=>map[catName(m.category)]=(map[catName(m.category)]||0)+m.amount);new Chart(el,{type:'doughnut',data:{labels:Object.keys(map),datasets:[{data:Object.values(map)}]},options:{plugins:{legend:{position:'bottom'}}}})}
renderNav();render();
</script></body></html>
