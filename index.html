<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas · V9 · GRUPOS</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--green:#159447;--red:#d83a3a;--orange:#d97706;--shadow:0 8px 28px rgba(20,30,40,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:245px;background:#111827;color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:21px;font-weight:800;padding:10px 12px 20px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:#263244;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1600px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:var(--accent);color:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--red)}.btn.green{background:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:27px;font-weight:800;margin-top:8px}.positive{color:var(--green)}.negative{color:var(--red)}.section{margin-top:20px}.section h2{font-size:17px;margin:0 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}.table th{color:var(--muted);font-size:12px}.right{text-align:right!important}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d6dbe1;border-radius:9px;background:#fff;color:var(--text)}.filters>*{width:auto;min-width:145px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.span2{grid-column:1/-1}.bar{height:9px;background:#edf0f2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.row-actions{display:flex;gap:6px}.mini{padding:6px 9px;border-radius:7px;background:#f1f3f5;font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.dialog h3{margin:0 0 15px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:11px 15px;border-radius:9px;display:none;z-index:20}.chartbox{height:260px;position:relative;margin-top:8px}.chartbox svg{width:100%;height:100%;display:block}.chart-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}.chart-title h3{margin:0;font-size:16px}.chart-title span{font-size:12px;color:var(--muted)}.person-list{display:grid;gap:8px}.person-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px}.person-main{min-width:0}.person-name{font-weight:700}.person-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px}.split-people{border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}.split-person{display:grid;grid-template-columns:auto 1fr 120px;gap:9px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}.split-person:last-child{border-bottom:0}.split-person input[type=number]{padding:7px 8px;border:1px solid #d6dbe1;border-radius:8px;width:100%}.split-person input[type=number]:disabled{background:#f3f4f6;color:#9ca3af}.notice{padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;font-size:13px}.details{border:1px solid var(--line);border-radius:12px;padding:0;margin-top:10px;background:#fff}.details summary{cursor:pointer;padding:13px 15px;font-weight:700;list-style:none}.details summary::-webkit-details-marker{display:none}.detail-body{padding:0 15px 14px}.pill{font-size:11px;padding:4px 7px;border-radius:999px;background:#eef2ff}.mobile-nav{display:none}@media(max-width:900px){.side{display:none}.main{margin:0;width:100%;padding:18px 14px 80px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111827;z-index:8;overflow:auto}.mobile-nav button{flex:1;min-width:75px;background:transparent;color:#cbd5e1;padding:9px 5px;font-size:11px}.mobile-nav button.active{color:#fff;background:#263244}.top h1{font-size:23px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.filters>*{flex:1;min-width:120px}.split-person{grid-template-columns:auto 1fr 95px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">💶 Finanzas<br><span style="font-size:12px;color:#93c5fd">V9 · GRUPOS</span></div><div class="nav" id="nav"></div></aside><main class="main"><div id="view"></div></main></div>
<div class="mobile-nav" id="mnav"></div>
<div class="modal" id="modal"><div class="dialog"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="dialog-foot"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" id="modalSave">Guardar</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='finanzas_single_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const defaultState={accounts:[],movements:[],recurring:[],categories:[{id:uid(),name:'Vivienda',type:'expense'},{id:uid(),name:'Alimentación',type:'expense'},{id:uid(),name:'Transporte',type:'expense'},{id:uid(),name:'Ocio',type:'expense'},{id:uid(),name:'Salud',type:'expense'},{id:uid(),name:'Otros',type:'expense'},{id:uid(),name:'Nómina',type:'income'},{id:uid(),name:'Otros ingresos',type:'income'}],subcategories:[],people:[],groups:[],debts:[],collections:[],settings:{lastRecurringRun:'',lastRecurringDay:0}};
let state=load();let page='dashboard';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){const s={...defaultState,...x,settings:{...defaultState.settings,...(x.settings||{})}};['accounts','movements','recurring','categories','subcategories','people','groups','debts','collections'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});migratePeople(s);return s}}catch(e){console.error(e)}return JSON.parse(JSON.stringify(defaultState))}
function migratePeople(s){s.people=s.people||[];const byName=n=>s.people.find(p=>p.name.trim().toLowerCase()===String(n||'').trim().toLowerCase());s.debts.forEach(d=>{if(!d.personId){let p=byName(d.person);if(!p){p={id:uid(),name:String(d.person||'Sin nombre').trim()||'Sin nombre'};s.people.push(p)}d.personId=p.id}if(!d.person)d.person=s.people.find(p=>p.id===d.personId)?.name||'Sin nombre'});try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function nav(){const items=[['dashboard','🏠','Resumen'],['accounts','💳','Cuentas'],['movements','💸','Movimientos'],['recurring','🔄','Recurrentes'],['categories','🗂️','Categorías'],['debts','🤝','Deudas / Split'],['groups','👥','GRUPOS'],['history','📊','Histórico'],['irpf','🧮','IRPF'],['data','💾','Datos / Copias'],['diagnostic','🧪','Pruebas']];const html=items.map(i=>`<button class="${page===i[0]?'active':''}" onclick="go('${i[0]}')">${i[1]} ${i[2]}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mnav').innerHTML=html}
function go(p){page=p;nav();render();scrollTo(0,0)}
function accountBalance(id){const a=state.accounts.find(x=>x.id===id);let b=Number(a?.initial||0);state.movements.filter(m=>m.accountId===id).forEach(m=>b+=(m.type==='income'?1:-1)*Number(m.amount));state.movements.filter(m=>m.type==='transfer'&&(m.from===id||m.to===id)).forEach(m=>b+=(m.to===id?1:-1)*Number(m.amount));return b}
function totals(ms=state.movements){return ms.reduce((r,m)=>{if(m.type==='income')r.i+=+m.amount;if(m.type==='expense')r.e+=+m.amount;return r},{i:0,e:0})}
function render(){generateRecurring();document.getElementById('view').innerHTML=pages[page]();if(page==='history')filterHist()}
function monthMov(){const ym=today().slice(0,7);return state.movements.filter(m=>m.date?.startsWith(ym))}
function monthRange(n=12){const d=new Date();const arr=[];for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);arr.push({key:`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`,label:x.toLocaleDateString('es-ES',{month:'short'}).replace('.','')+' '+String(x.getFullYear()).slice(2)});}return arr}
function monthlyData(){const months=monthRange(12);const bal=[];const inc=[];const exp=[];const initial=state.accounts.reduce((s,a)=>s+Number(a.initial||0),0);months.forEach(m=>{const before=state.movements.filter(x=>x.date&&x.date.slice(0,7)<=m.key);let b=initial;b+=before.reduce((s,x)=>x.type==='income'?s+Number(x.amount):x.type==='expense'?s-Number(x.amount):s,0);b+=before.filter(x=>x.type==='transfer').reduce((s,x)=>s,0);bal.push(b);const mm=state.movements.filter(x=>x.date?.startsWith(m.key));const t=totals(mm);inc.push(t.i);exp.push(t.e)});return {months,bal,inc,exp}}
function lineChart(title,subtitle,values,labels,formatter,cls){const w=900,h=250,pad={l:55,r:18,t:22,b:34};const max=Math.max(...values,0),min=Math.min(...values,0);const lo=min<0?min:0,hi=max===lo?lo+1:max;const X=i=>pad.l+i*(w-pad.l-pad.r)/Math.max(1,values.length-1);const Y=v=>pad.t+(hi-v)*(h-pad.t-pad.b)/(hi-lo);const pts=values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');let grid='';for(let i=0;i<5;i++){const v=hi-(hi-lo)*i/4;const y=Y(v);grid+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="#e5e7eb"/><text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#6b7280">${esc(formatter(v))}</text>`}const dots=values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="currentColor"/>`).join('');const labs=labels.map((l,i)=>`<text x="${X(i)}" y="${h-10}" text-anchor="middle" font-size="10" fill="#6b7280">${esc(l)}</text>`).join('');return `<div class="card"><div class="chart-title"><h3>${esc(title)}</h3><span>${esc(subtitle)}</span></div><div class="chartbox"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><g>${grid}</g><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="${cls}"/>${dots}${labs}</svg></div></div>`}
function debtSignedAmount(d){const a=Math.abs(Number(d.amount)||0);return d.direction==='i_owe'?-a:a}
const diagnosticPage=()=>'<div class="top"><div><h1>🧪 Pruebas del sistema</h1><div class="sub">Comprueba los cálculos de Deudas / Split y los grupos.</div></div></div><div class="grid"><div class="card metric"><div class="label">Grupos creados</div><div class="value">'+state.groups.length+'</div></div><div class="card metric"><div class="label">Personas</div><div class="value">'+state.people.length+'</div></div><div class="card metric"><div class="label">Deudas</div><div class="value">'+state.debts.length+'</div></div><div class="card metric"><div class="label">Saldo neto</div><div class="value">'+eur(state.debts.filter(d=>!d.collected).reduce((s,d)=>s+debtSignedAmount(d),0))+'</div></div></div><div class="card section"><h2>Pruebas automáticas</h2><div id="diagResults"></div><button class="btn" onclick="runDiagnostics()">Ejecutar pruebas</button></div>';
function runDiagnostics(){const out=[];const check=(name,ok,detail)=>out.push('<div style="padding:9px;border-bottom:1px solid var(--line)"><b>'+(ok?'🟢':'🔴')+' '+name+'</b><div class="sub">'+esc(detail)+'</div></div>');check('Signo Me deben',debtSignedAmount({amount:10,direction:'owed_to_me'})===10,'10 € → +10 €');check('Signo Yo debo',debtSignedAmount({amount:5,direction:'i_owe'})===-5,'5 € → −5 €');check('Compensación',10-5===5,'+10 − 5 = +5');const cents=1000,n=2,base=Math.floor(cents/n),rem=cents-base*n,parts=[base+(0<rem?1:0),base+(1<rem?1:0)].map(x=>x/100);check('Partes iguales',parts[0]===5&&parts[1]===5,'10 € entre tú y otra persona → 5 €');check('Grupos disponibles',Array.isArray(state.groups),'La estructura groups existe');check('Integrantes de grupos',state.groups.every(g=>Array.isArray(g.personIds)),'Cada grupo guarda personIds');document.getElementById('diagResults').innerHTML=out.join('')}
const pages={diagnostic:()=>diagnosticPage(),
 dashboard(){const t=totals(),mt=totals(monthMov()),bal=state.accounts.reduce((s,a)=>s+accountBalance(a.id),0);const cats={};monthMov().filter(m=>m.type==='expense').forEach(m=>cats[m.category]=(cats[m.category]||0)+ +m.amount);const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);const md=monthlyData();return `<div class="top"><div><h1>Resumen</h1><div class="sub">Situación financiera y actividad reciente</div></div><div class="actions"><button class="btn" onclick="openMovement('expense')">+ Gasto</button><button class="btn green" onclick="openMovement('income')">+ Ingreso</button><button class="btn secondary" onclick="openTransfer()">⇄ Transferencia</button></div></div><div class="grid"><div class="card metric"><div class="label">Balance total</div><div class="value ${bal>=0?'positive':'negative'}">${eur(bal)}</div></div><div class="card metric"><div class="label">Ingresos del mes</div><div class="value positive">${eur(mt.i)}</div></div><div class="card metric"><div class="label">Gastos del mes</div><div class="value negative">${eur(mt.e)}</div></div><div class="card metric"><div class="label">Balance del mes</div><div class="value ${mt.i-mt.e>=0?'positive':'negative'}">${eur(mt.i-mt.e)}</div></div></div><div class="section"><div class="two">${lineChart('Evolución del dinero','Balance al cierre mensual',md.bal,md.months.map(x=>x.label),v=>eur(v),'positive')}${lineChart('Evolución del gasto','Total mensual',md.exp,md.months.map(x=>x.label),v=>eur(v),'negative')}</div><div style="margin-top:14px">${lineChart('Evolución de ingresos','Total mensual',md.inc,md.months.map(x=>x.label),v=>eur(v),'positive')}</div></div><div class="two section"><div class="card"><h2>Cuentas</h2>${state.accounts.length?state.accounts.map(a=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(a.name)}</span><b>${eur(accountBalance(a.id))}</b></div>`).join(''):'<div class="empty">Añade tu primera cuenta.</div>'}</div><div class="card"><h2>Gastos por categoría · este mes</h2>${top.length?top.map(([k,v])=>`<div style="margin:11px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(k||'Sin categoría')}</span><b>${eur(v)}</b></div><div class="bar"><i style="width:${Math.max(3,v/(top[0][1]||1)*100)}%"></i></div></div>`).join(''):'<div class="empty">Sin gastos este mes.</div>'}</div></div><div class="card section"><h2>Movimientos recientes</h2>${movementTable(state.movements.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</div>`},
 accounts(){return `<div class="top"><div><h1>Cuentas</h1><div class="sub">Saldo inicial + movimientos y transferencias</div></div><button class="btn" onclick="openAccount()">+ Cuenta</button></div><div class="grid">${state.accounts.map(a=>`<div class="card"><div class="sub">CUENTA</div><h2>${esc(a.name)}</h2><div class="value" style="font-size:25px;font-weight:800">${eur(accountBalance(a.id))}</div><div class="sub">Inicial: ${eur(a.initial)}</div><div class="actions" style="margin-top:12px"><button class="mini" onclick="openAccount('${a.id}')">Editar</button><button class="mini" onclick="delAccount('${a.id}')">Eliminar</button></div></div>`).join('')||'<div class="card empty">No hay cuentas. Crea una para empezar.</div>'}</div>`},
 movements(){return `<div class="top"><div><h1>Movimientos</h1><div class="sub">Ingresos, gastos y transferencias</div></div><div class="actions"><button class="btn" onclick="openMovement('expense')">+ Gasto</button><button class="btn green" onclick="openMovement('income')">+ Ingreso</button><button class="btn secondary" onclick="openTransfer()">⇄ Transferencia</button></div></div><div class="card"><div class="filters"><select id="mfType" onchange="filterMov()"><option value="">Todos</option><option value="expense">Gastos</option><option value="income">Ingresos</option><option value="transfer">Transferencias</option></select><select id="mfAccount" onchange="filterMov()"><option value="">Todas las cuentas</option>${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><input class="input" id="mfSearch" placeholder="Buscar concepto, categoría…" oninput="filterMov()"><input class="input" id="mfFrom" type="date" onchange="filterMov()"><input class="input" id="mfTo" type="date" onchange="filterMov()"></div><div id="movementResults">${movementTable(state.movements)}</div></div>`},
 recurring(){const active=state.recurring.filter(r=>r.active),re=active.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0),ri=active.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0);return `<div class="top"><div><h1>Recurrentes</h1><div class="sub">Se genera una vez por mes al abrir la aplicación, sin duplicados.</div></div><button class="btn" onclick="openRecurring()">+ Recurrente</button></div><div class="grid"><div class="card metric"><div class="label">Gastos recurrentes activos</div><div class="value negative">${eur(re)}</div></div><div class="card metric"><div class="label">Ingresos recurrentes activos</div><div class="value positive">${eur(ri)}</div></div><div class="card metric"><div class="label">Diferencia mensual</div><div class="value ${ri-re>=0?'positive':'negative'}">${eur(ri-re)}</div></div><div class="card metric"><div class="label">Recurrentes activos</div><div class="value">${active.length}</div></div></div><div class="card section tablewrap"><table class="table"><thead><tr><th>Concepto</th><th>Tipo</th><th>Importe</th><th>Cuenta</th><th>Día</th><th>Estado</th><th></th></tr></thead><tbody>${state.recurring.map(r=>`<tr><td>${esc(r.concept)}</td><td>${r.type==='income'?'Ingreso':'Gasto'}</td><td>${eur(r.amount)}</td><td>${esc(accName(r.accountId))}</td><td>${r.day}</td><td>${r.active?'Activa':'Inactiva'}</td><td><button class="mini" onclick="toggleRecurring('${r.id}')">${r.active?'Desactivar':'Activar'}</button> <button class="mini" onclick="openRecurring('${r.id}')">Editar</button> <button class="mini" onclick="delRecurring('${r.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin recurrentes.</td></tr>'}</tbody></table></div>`},
 categories(){return `<div class="top"><div><h1>Categorías</h1><div class="sub">Categorías y subcategorías persistentes</div></div><div class="actions"><button class="btn" onclick="openCategory()">+ Categoría</button><button class="btn secondary" onclick="openSubcategory()">+ Subcategoría</button></div></div><div class="two"><div class="card"><h2>Categorías</h2>${state.categories.map(c=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><span><span class="tag">${c.type==='income'?'Ingreso':'Gasto'}</span> ${esc(c.name)}</span><span><button class="mini" onclick="openCategory('${c.id}')">Editar</button> <button class="mini" onclick="delCategory('${c.id}')">Eliminar</button></span></div>`).join('')||'<div class="empty">Sin categorías.</div>'}</div><div class="card"><h2>Subcategorías</h2>${state.subcategories.map(s=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(s.name)} <span class="sub">· ${esc(catName(s.categoryId))}</span></span><span><button class="mini" onclick="openSubcategory('${s.id}')">Editar</button> <button class="mini" onclick="delSubcategory('${s.id}')">Eliminar</button></span></div>`).join('')||'<div class="empty">Sin subcategorías.</div>'}</div></div>`},
 debts(){const pending=state.debts.filter(d=>!d.collected),total=pending.reduce((s,d)=>s+debtSignedAmount(d),0),collected=state.collections.reduce((s,x)=>s+ +x.amount,0);const people=state.people.map(p=>{const ds=state.debts.filter(d=>d.personId===p.id||(!d.personId&&d.person===p.name));return {p,ds,pending:ds.filter(d=>!d.collected).reduce((s,d)=>s+debtSignedAmount(d),0),total:ds.reduce((s,d)=>s+debtSignedAmount(d),0)}}).filter(x=>x.ds.length);return `<div class="top"><div><h1>Deudas / Split</h1><div class="sub">Versión V10 · Grupos + reparto neto</div><div class="sub">Primero crea personas. Después asígnalas a cada gasto compartido.</div></div><div class="actions"><button class="btn secondary" onclick="openPerson()">+ Persona</button><button class="btn" onclick="openDebt()">+ Gasto compartido</button></div></div><div class="grid"><div class="card metric"><div class="label">Pendiente total</div><div class="value ${total<0?'negative':total>0?'positive':''}">${eur(total)}</div></div><div class="card metric"><div class="label">Personas con saldo pendiente</div><div class="value">${new Set(pending.map(d=>d.personId||d.person)).size}</div></div><div class="card metric"><div class="label">Cobrado histórico</div><div class="value positive">${eur(collected)}</div></div><div class="card metric"><div class="label">Operaciones</div><div class="value">${state.debts.length}</div></div></div><div class="two section"><div class="card"><h2>Personas</h2>${state.people.length?`<div class="person-list">${state.people.map(p=>{const ds=state.debts.filter(d=>d.personId===p.id),pe=ds.filter(d=>!d.collected).reduce((s,d)=>s+debtSignedAmount(d),0),tt=ds.reduce((s,d)=>s+debtSignedAmount(d),0);return `<div class="person-row"><div class="person-main"><div class="person-name">${esc(p.name)}</div><div class="person-stats"><span>Pendiente: <b class="${pe<0?'negative':pe>0?'positive':''}">${eur(pe)}</b></span><span>Total: ${eur(tt)}</span><span>${ds.length} deuda${ds.length===1?'':'s'}</span></div></div><div class="row-actions"><button class="mini" onclick="openPerson('${p.id}')">Editar</button><button class="mini" onclick="delPerson('${p.id}')">Eliminar</button></div></div>`}).join('')}</div>`:'<div class="empty">Crea aquí las personas a las que sueles repartir gastos.</div>'}</div><div class="card" id="splitGroupsBox"><h2>👥 Grupos</h2><div class="sub" style="margin-bottom:10px">Gestiona aquí tus grupos de Split. Puedes crear un grupo y editar sus integrantes en cualquier momento.</div><button class="btn" onclick="openGroup()" style="margin-bottom:12px">+ Crear grupo</button>${state.groups.length?state.groups.map(g=>`<div class="person-row"><div class="person-main"><div class="person-name">${esc(g.name)}</div><div class="person-stats"><span>${(g.personIds||[]).length} personas</span></div></div><div class="row-actions"><button class="mini" onclick="openGroup('${g.id}')">Editar</button><button class="mini" onclick="delGroup('${g.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">Sin grupos.</div>'}</div><div class="card"><h2>Consulta por persona</h2>${people.length?people.map(x=>`<details class="details"><summary>${esc(x.p.name)} · <span class="${x.pending<0?'negative':x.pending>0?'positive':''}">Saldo neto ${eur(x.pending)}</span></summary><div class="detail-body">${x.ds.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(d.concept)}</b><div class="sub">${d.date} · ${d.direction==='i_owe'?'Tú debes':'Te deben'} · ${d.collected?(d.direction==='i_owe'?'Pagado':'Cobrado'):'Pendiente'}${d.total?` · Gasto total ${eur(d.total)} · Tu parte ${eur(debtSignedAmount(d))}`:''}${d.groupId?` · Grupo: ${esc(groupName(d.groupId))}`:''}</div></div><div style="text-align:right"><b class="${d.direction==='i_owe'?'negative':'positive'}">${eur(debtSignedAmount(d))}</b>${d.collected?'':`<br><button class="mini" onclick="collectDebt('${d.id}')">Cobrar</button>`} <button class="mini" onclick="openDebtEdit('${d.id}')">Editar</button> <button class="mini" onclick="delDebt('${d.id}')">Eliminar</button></div></div>`).join('')}</div></details>`).join(''):'<div class="empty">Todavía no hay deudas asignadas.</div>'}</div></div><div class="card section"><h2>Detalle de todas las deudas</h2><div id="debtTableResults">${state.debts.length?movementDebtTable(state.debts):'<div class="empty">Sin deudas.</div>'}</div></div>`},
 groups(){return `<div class="top"><div><h1>👥 Grupos</h1><div class="sub">Crea grupos de personas y modifica sus integrantes cuando quieras.</div></div><button class="btn" onclick="openGroup()">+ Crear grupo</button></div><div class="card"><div class="notice" style="margin-bottom:14px"><b>Los grupos no borran ni modifican personas.</b> Un grupo es una selección reutilizable para nuevos gastos compartidos. Si cambias sus integrantes, las deudas ya registradas permanecen como estaban.</div>${state.groups.length?state.groups.map(g=>`<div class="person-row"><div class="person-main"><div class="person-name">👥 ${esc(g.name)}</div><div class="person-stats"><span><b>${(g.personIds||[]).length}</b> integrantes</span><span>${(g.personIds||[]).map(id=>esc(personName(id)||'Sin nombre')).join(' · ')||'Sin integrantes'}</span></div></div><div class="row-actions"><button class="mini" onclick="openGroup('${g.id}')">Editar integrantes</button><button class="mini" onclick="delGroup('${g.id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">No hay grupos creados. Pulsa «+ Crear grupo».</div>'}</div>`},
 history(){return `<div class="top"><div><h1>Histórico</h1><div class="sub">Busca y filtra todos los movimientos.</div></div><button class="btn secondary" onclick="exportCSV()">Exportar CSV</button></div><div class="card"><div class="filters"><select id="hfType" onchange="filterHist()"><option value="">Todos</option><option value="expense">Gastos</option><option value="income">Ingresos</option></select><select id="hfCat" onchange="filterHist()"><option value="">Todas categorías</option>${state.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><select id="hfAccount" onchange="filterHist()"><option value="">Todas cuentas</option>${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><select id="hfPerson" onchange="filterHist()"><option value="">Todas las personas</option>${state.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input class="input" id="hfSearch" placeholder="Buscar texto…" oninput="filterHist()"><input class="input" id="hfFrom" type="date" onchange="filterHist()"><input class="input" id="hfTo" type="date" onchange="filterHist()"></div><div id="histResults"></div></div>`},
 irpf(){return `<div class="top"><div><h1>🧮 IRPF</h1><div class="sub">Calculadora basada literalmente en el código que proporcionaste.</div></div></div><div class="two"><div class="card"><div class="formgrid"><div class="field"><label>Salario bruto anual</label><input class="input" id="irSalary" type="number" step="0.01" value="34474.73"></div><div class="field"><label>Número de pagas</label><select id="irPays"><option>14</option><option>12</option></select></div><div class="field span2"><label>Comunidad autónoma</label><select id="irCom"><option>Extremadura</option><option>Castilla La Mancha</option></select></div></div><button class="btn" style="margin-top:14px" onclick="calcIRPF()">Calcular</button></div><div class="card" id="irResult"><div class="empty">Introduce los datos y pulsa calcular.</div></div></div>`},
 data(){return `<div class="top"><div><h1>Datos / Copias</h1><div class="sub">Todo queda guardado en este navegador.</div></div></div><div class="two"><div class="card"><h2>Exportar</h2><p>Guarda una copia completa JSON o el histórico en CSV.</p><div class="actions"><button class="btn" onclick="exportJSON()">📤 Copia completa</button><button class="btn secondary" onclick="exportCSV()">📄 CSV</button></div></div><div class="card"><h2>Importar</h2><p>Restaura una copia JSON anterior. Las personas nuevas se migran automáticamente si existen deudas antiguas.</p><input id="importFile" type="file" accept="application/json"><button class="btn" style="margin-top:10px" onclick="importJSON()">📥 Restaurar</button></div></div><div class="card section"><h2>Zona de seguridad</h2><p class="sub">Borrar todos los datos es irreversible en este navegador. Exporta una copia antes.</p><button class="btn danger" onclick="resetAll()">Borrar todos los datos</button></div>`}
};
function movementTable(ms){if(!ms.length)return '<div class="empty">No hay movimientos.</div>';return `<div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Categoría</th><th>Cuenta</th><th class="right">Importe</th><th></th></tr></thead><tbody>${ms.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<tr><td>${m.date}</td><td>${esc(m.concept)}</td><td>${m.type==='income'?'Ingreso':m.type==='expense'?'Gasto':'Transferencia'}</td><td>${esc(m.category||'—')}</td><td>${esc(m.type==='transfer'?accName(m.from)+' → '+accName(m.to):accName(m.accountId))}</td><td class="right ${m.type==='income'?'positive':m.type==='expense'?'negative':''}">${m.type==='expense'?'-':m.type==='income'?'+':''}${eur(m.amount)}</td><td class="row-actions"><button class="mini" onclick="openMovement('${m.type}','${m.id}')">Editar</button><button class="mini" onclick="delMovement('${m.id}')">Borrar</button></td></tr>`).join('')}</tbody></table></div>`}
function movementDebtTable(ds){const q=(document.getElementById('debtSearch')?.value||'').toLowerCase().trim(),person=document.getElementById('debtPerson')?.value||'',group=document.getElementById('debtGroup')?.value||'',direction=document.getElementById('debtDirection')?.value||'',status=document.getElementById('debtStatus')?.value||'';const rows=ds.filter(d=>{const name=(personName(d.personId)||d.person||'').toLowerCase();return (!q||name.includes(q)||(d.concept||'').toLowerCase().includes(q)||(groupName(d.groupId)||'').toLowerCase().includes(q))&&(!person||d.personId===person)&&(!group||d.groupId===group)&&(!direction||d.direction===direction)&&(!status||(status==='pending'?!d.collected:d.collected))}).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="filters"><input class="input" id="debtSearch" placeholder="Buscar persona, concepto o grupo…" value="${esc(q)}" oninput="filterDebts()"><select id="debtPerson" onchange="filterDebts()"><option value="">Todas las personas</option>${state.people.map(p=>`<option value="${p.id}" ${p.id===person?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="debtGroup" onchange="filterDebts()"><option value="">Todos los grupos</option>${state.groups.map(g=>`<option value="${g.id}" ${g.id===group?'selected':''}>${esc(g.name)}</option>`).join('')}</select><select id="debtDirection" onchange="filterDebts()"><option value="">Todas</option><option value="owed_to_me" ${direction==='owed_to_me'?'selected':''}>Me deben</option><option value="i_owe" ${direction==='i_owe'?'selected':''}>Yo debo</option></select><select id="debtStatus" onchange="filterDebts()"><option value="">Todos los estados</option><option value="pending" ${status==='pending'?'selected':''}>Pendientes</option><option value="paid" ${status==='paid'?'selected':''}>Pagados / cobrados</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Persona</th><th>Grupo</th><th>Concepto</th><th>Fecha</th><th>Dirección</th><th>Importe</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.length?rows.map(d=>`<tr><td>${esc(personName(d.personId)||d.person)}</td><td>${esc(groupName(d.groupId)||'—')}</td><td>${esc(d.concept)}</td><td>${d.date}</td><td>${d.direction==='i_owe'?'Yo debo':'Me deben'}</td><td class="${d.direction==='i_owe'?'negative':'positive'}">${eur(debtSignedAmount(d))}</td><td>${d.collected?(d.direction==='i_owe'?'Pagado':'Cobrado'):'Pendiente'}</td><td class="row-actions">${d.collected?'':`<button class="mini" onclick="collectDebt('${d.id}')">${d.direction==='i_owe'?'Marcar pagado':'Marcar cobrado'}</button>`}<button class="mini" onclick="openDebtEdit('${d.id}')">Editar</button><button class="mini" onclick="delDebt('${d.id}')">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">No hay deudas que coincidan con el filtro.</td></tr>'}</tbody></table></div>`}
function filterDebts(){const el=document.getElementById('debtTableResults');if(el)el.innerHTML=movementDebtTable(state.debts)}

function accName(id){return state.accounts.find(a=>a.id===id)?.name||'—'}function catName(id){return state.categories.find(c=>c.id===id)?.name||'—'}function personName(id){return state.people.find(p=>p.id===id)?.name||''}
function openModal(title,html,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show');document.getElementById('modalSave').onclick=()=>{try{fn()}catch(e){console.error(e);alert('No se pudo guardar: '+e.message)}}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openAccount(id=''){const a=state.accounts.find(x=>x.id===id)||{name:'',initial:0};openModal(id?'Editar cuenta':'Nueva cuenta',`<div class="formgrid"><div class="field span2"><label>Nombre</label><input class="input" id="fName" value="${esc(a.name)}"></div><div class="field span2"><label>Saldo inicial</label><input class="input" id="fInitial" type="number" step="0.01" value="${a.initial}"></div></div>`,()=>{const name=document.getElementById('fName').value.trim();if(!name)throw Error('Escribe un nombre');const initial=+document.getElementById('fInitial').value||0;if(id)Object.assign(a,{name,initial});else state.accounts.push({id:uid(),name,initial});save();closeModal();render()})}
function delAccount(id){if(state.movements.some(m=>m.accountId===id||m.from===id||m.to===id))return alert('No puedes borrar una cuenta con movimientos asociados.');if(confirm('¿Eliminar cuenta?')){state.accounts=state.accounts.filter(a=>a.id!==id);save();render()}}
function openMovement(type,id=''){const m=state.movements.find(x=>x.id===id)||{date:today(),concept:'',amount:'',accountId:state.accounts[0]?.id||'',category:state.categories.find(c=>c.type===type)?.name||'',subcategory:''};const cats=state.categories.filter(c=>c.type===type);openModal(id?'Editar movimiento':type==='income'?'Nuevo ingreso':'Nuevo gasto',`<div class="formgrid"><div class="field"><label>Fecha</label><input class="input" id="fDate" type="date" value="${m.date}"></div><div class="field"><label>Importe</label><input class="input" id="fAmount" type="number" min="0" step="0.01" value="${m.amount}"></div><div class="field"><label>Cuenta</label><select id="fAccount">${state.accounts.map(a=>`<option value="${a.id}" ${a.id===m.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Categoría</label><select id="fCat"><option value="">Sin categoría</option>${cats.map(c=>`<option ${c.name===m.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Subcategoría</label><select id="fSub"><option value="">Sin subcategoría</option>${state.subcategories.filter(s=>s.categoryId===cats.find(c=>c.name===m.category)?.id).map(s=>`<option ${s.name===m.subcategory?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field span2"><label>Descripción / concepto</label><input class="input" id="fConcept" value="${esc(m.concept)}"></div></div>`,()=>{if(!state.accounts.length)throw Error('Crea una cuenta primero');const data={date:document.getElementById('fDate').value,amount:+document.getElementById('fAmount').value,accountId:document.getElementById('fAccount').value,category:document.getElementById('fCat').value,subcategory:document.getElementById('fSub').value,concept:document.getElementById('fConcept').value.trim(),type};if(data.amount<=0)throw Error('El importe debe ser mayor que 0');if(!data.concept)throw Error('Escribe un concepto');if(id)Object.assign(m,data);else state.movements.push({id:uid(),...data});save();closeModal();render()})}
function openTransfer(){if(state.accounts.length<2)return alert('Necesitas al menos dos cuentas.');openModal('Nueva transferencia',`<div class="formgrid"><div class="field"><label>Fecha</label><input class="input" id="tDate" type="date" value="${today()}"></div><div class="field"><label>Importe</label><input class="input" id="tAmount" type="number" min="0" step="0.01"></div><div class="field"><label>Desde</label><select id="tFrom">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Hacia</label><select id="tTo">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field span2"><label>Concepto</label><input class="input" id="tConcept" value="Transferencia entre cuentas"></div></div>`,()=>{const from=document.getElementById('tFrom').value,to=document.getElementById('tTo').value,amount=+document.getElementById('tAmount').value;if(from===to)throw Error('Las cuentas deben ser distintas');if(amount<=0)throw Error('Importe inválido');state.movements.push({id:uid(),type:'transfer',date:document.getElementById('tDate').value,amount,from,to,concept:document.getElementById('tConcept').value});save();closeModal();render()})}
function delMovement(id){if(confirm('¿Borrar movimiento?')){state.movements=state.movements.filter(m=>m.id!==id);save();render()}}
function openRecurring(id=''){const r=state.recurring.find(x=>x.id===id)||{concept:'',amount:'',type:'expense',accountId:state.accounts[0]?.id||'',category:state.categories.find(c=>c.type==='expense')?.name||'',subcategory:'',day:1,active:true};openModal(id?'Editar recurrente':'Nuevo recurrente',`<div class="formgrid"><div class="field span2"><label>Concepto</label><input class="input" id="rConcept" value="${esc(r.concept)}"></div><div class="field"><label>Importe</label><input class="input" id="rAmount" type="number" step="0.01" value="${r.amount}"></div><div class="field"><label>Tipo</label><select id="rType"><option value="expense" ${r.type==='expense'?'selected':''}>Gasto</option><option value="income" ${r.type==='income'?'selected':''}>Ingreso</option></select></div><div class="field"><label>Cuenta</label><select id="rAccount">${state.accounts.map(a=>`<option value="${a.id}" ${a.id===r.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Día del mes</label><input class="input" id="rDay" type="number" min="1" max="31" value="${r.day}"></div><div class="field span2"><label>Categoría</label><input class="input" id="rCat" value="${esc(r.category)}"></div></div>`,()=>{const x={concept:document.getElementById('rConcept').value.trim(),amount:+document.getElementById('rAmount').value,type:document.getElementById('rType').value,accountId:document.getElementById('rAccount').value,category:document.getElementById('rCat').value.trim(),day:Math.min(31,Math.max(1,+document.getElementById('rDay').value||1)),active:r.active!==false};if(!x.concept||x.amount<=0)throw Error('Concepto e importe son obligatorios');if(id)Object.assign(r,x);else state.recurring.push({id:uid(),...x});save();closeModal();render()})}
function toggleRecurring(id){const r=state.recurring.find(x=>x.id===id);if(r){r.active=!r.active;save();render()}}function delRecurring(id){if(confirm('¿Eliminar recurrente?')){state.recurring=state.recurring.filter(x=>x.id!==id);save();render()}}
function generateRecurring(){const now=new Date(),ym=today().slice(0,7),day=now.getDate();if(state.settings.lastRecurringRun===ym&&state.settings.lastRecurringDay===day)return;state.recurring.filter(r=>r.active&&day>=Number(r.day||1)).forEach(r=>{const key=`recurring:${r.id}:${ym}`;if(!state.movements.some(m=>m.recurringKey===key)){state.movements.push({id:uid(),type:r.type,date:`${ym}-${String(Math.min(Number(r.day||1),new Date(now.getFullYear(),now.getMonth()+1,0).getDate())).padStart(2,'0')}`,amount:r.amount,accountId:r.accountId,category:r.category,subcategory:r.subcategory||'',concept:r.concept,recurringKey:key})}});state.settings.lastRecurringRun=ym;state.settings.lastRecurringDay=day;save()}
function openCategory(id=''){const c=state.categories.find(x=>x.id===id)||{name:'',type:'expense'};openModal(id?'Editar categoría':'Nueva categoría',`<div class="formgrid"><div class="field"><label>Nombre</label><input class="input" id="cName" value="${esc(c.name)}"></div><div class="field"><label>Tipo</label><select id="cType"><option value="expense" ${c.type==='expense'?'selected':''}>Gasto</option><option value="income" ${c.type==='income'?'selected':''}>Ingreso</option></select></div></div>`,()=>{const name=document.getElementById('cName').value.trim();if(!name)throw Error('Nombre obligatorio');if(id)Object.assign(c,{name,type:document.getElementById('cType').value});else state.categories.push({id:uid(),name,type:document.getElementById('cType').value});save();closeModal();render()})}
function delCategory(id){const c=state.categories.find(x=>x.id===id);if(state.movements.some(m=>m.category===c.name)||state.recurring.some(r=>r.category===c.name))return alert('No se puede eliminar: hay movimientos/recurrentes que la usan.');if(confirm('¿Eliminar categoría?')){state.categories=state.categories.filter(x=>x.id!==id);save();render()}}
function openSubcategory(id=''){const s=state.subcategories.find(x=>x.id===id)||{name:'',categoryId:state.categories[0]?.id||''};openModal(id?'Editar subcategoría':'Nueva subcategoría',`<div class="formgrid"><div class="field"><label>Nombre</label><input class="input" id="sName" value="${esc(s.name)}"></div><div class="field"><label>Categoría</label><select id="sCat">${state.categories.map(c=>`<option value="${c.id}" ${c.id===s.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>`,()=>{const name=document.getElementById('sName').value.trim();if(!name)throw Error('Nombre obligatorio');if(id)Object.assign(s,{name,categoryId:document.getElementById('sCat').value});else state.subcategories.push({id:uid(),name,categoryId:document.getElementById('sCat').value});save();closeModal();render()})}
function delSubcategory(id){if(confirm('¿Eliminar subcategoría?')){state.subcategories=state.subcategories.filter(x=>x.id!==id);save();render()}}
function openPerson(id=''){const p=state.people.find(x=>x.id===id)||{name:''};openModal(id?'Editar persona':'Nueva persona',`<div class="field"><label>Nombre</label><input class="input" id="pName" value="${esc(p.name)}" placeholder="Ej. Ana"></div>`,()=>{const name=document.getElementById('pName').value.trim();if(!name)throw Error('Escribe un nombre');const duplicate=state.people.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==id);if(duplicate)throw Error('Ya existe una persona con ese nombre');if(id)Object.assign(p,{name});else state.people.push({id:uid(),name});save();closeModal();render()})}
function delPerson(id){const p=state.people.find(x=>x.id===id);if(!p)return;const ds=state.debts.filter(d=>d.personId===id||(!d.personId&&String(d.person||'').trim().toLowerCase()===p.name.trim().toLowerCase()));const debtIds=new Set(ds.map(d=>d.id));const msg=ds.length?`¿Eliminar a ${p.name} y sus ${ds.length} deuda${ds.length===1?'':'s'} asociada${ds.length===1?'':'s'}? El gasto original de tu cuenta NO se borrará.`:`¿Eliminar a ${p.name}?`;if(confirm(msg)){state.debts=state.debts.filter(d=>!debtIds.has(d.id));state.collections=state.collections.filter(c=>!debtIds.has(c.debtId)&&c.personId!==id);state.people=state.people.filter(x=>x.id!==id);save();render();toast('Persona eliminada')}}
function splitPeopleHtml(){if(!state.people.length)return `<div class="notice">No hay personas creadas. Pulsa <b>+ Crear persona</b>.</div>`;return `<div class="split-people">${state.people.map(p=>`<label class="split-person"><input type="checkbox" class="dp" value="${p.id}" onchange="updateSplitInputs()"><span>${esc(p.name)}</span><input type="number" class="da" id="amt_${p.id}" min="0" step="0.01" placeholder="Parte €" disabled></label>`).join('')}</div>`}
function updateSplitInputs(){const custom=document.getElementById('dMode')?.value==='custom';document.querySelectorAll('.dp').forEach(cb=>{const x=document.getElementById('amt_'+cb.value);if(x)x.disabled=!custom||!cb.checked;if(!cb.checked&&x)x.value=''})}
function quickAddPerson(){const name=prompt('Nombre de la persona:');if(!name)return;const n=name.trim();if(!n)return;if(state.people.some(p=>p.name.toLowerCase()===n.toLowerCase()))return alert('Esa persona ya existe.');state.people.push({id:uid(),name:n});save();const box=document.getElementById('splitPeopleBox');if(box)box.innerHTML=splitPeopleHtml()}
function groupName(id){return state.groups.find(g=>g.id===id)?.name||''}
function openGroup(id=''){const g=state.groups.find(x=>x.id===id)||{name:'',personIds:[]};openModal(id?'Editar grupo':'Nuevo grupo',`<div class="formgrid"><div class="field span2"><label>Nombre del grupo</label><input class="input" id="gName" value="${esc(g.name)}" placeholder="Ej. Amigos, Familia, Viaje"></div><div class="field span2"><label>Personas</label>${state.people.length?`<div class="split-people">${state.people.map(p=>`<label class="split-person"><input type="checkbox" class="gp" value="${p.id}" ${(g.personIds||[]).includes(p.id)?'checked':''}><span>${esc(p.name)}</span><span></span></label>`).join('')}</div>`:'<div class="notice">Crea primero alguna persona.</div>'}</div></div>`,()=>{const name=document.getElementById('gName').value.trim();if(!name)throw Error('Escribe un nombre');const personIds=[...document.querySelectorAll('.gp:checked')].map(x=>x.value);if(id)Object.assign(g,{name,personIds});else state.groups.push({id:uid(),name,personIds});save();closeModal();render()})}
function delGroup(id){if(confirm('¿Eliminar grupo? Las personas y deudas no se borrarán.')){state.groups=state.groups.filter(g=>g.id!==id);state.debts.forEach(d=>{if(d.groupId===id)delete d.groupId});save();render()}}
function applyGroup(){const id=document.getElementById('dGroup')?.value;if(!id)return;const g=state.groups.find(x=>x.id===id);if(!g)return;document.querySelectorAll('.dp').forEach(cb=>cb.checked=(g.personIds||[]).includes(cb.value));updateSplitInputs()}
function createGroupFromSplit(){openGroup();}
function openDebt(){if(!state.accounts.length)return alert('Crea una cuenta primero.');openModal('Nueva deuda / gasto compartido',`<div class="formgrid"><div class="field"><label>Fecha</label><input class="input" id="dDate" type="date" value="${today()}"></div><div class="field"><label>Importe total</label><input class="input" id="dTotal" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej. 100 o -100"></div><div class="field"><label>Tu cuenta</label><select id="dAccount">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Concepto</label><input class="input" id="dConcept" placeholder="Ej. Cena, viaje…"></div><div class="field span2"><label>Tipo de deuda</label><select id="dDirection"><option value="owed_to_me">Me deben</option><option value="i_owe">Yo debo</option></select></div><div class="field"><label>Reparto</label><select id="dMode" onchange="updateSplitInputs()"><option value="equal">Partes iguales entre todos</option><option value="full">Una persona: 100%</option><option value="custom">Personalizado</option></select></div><div class="field"><label>Grupo</label><div style="display:flex;gap:8px;align-items:stretch"><select id="dGroup" onchange="applyGroup()" style="flex:1"><option value="">Sin grupo</option>${state.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><button type="button" class="btn secondary" onclick="createGroupFromSplit()">+ Grupo</button></div><div class="sub" style="margin-top:6px">Puedes crear el grupo directamente desde este cuadro.</div></div><div class="field"><label>Personas</label><button type="button" class="btn secondary" style="width:100%" onclick="quickAddPerson()">+ Crear persona</button></div><div class="field span2"><label>Selecciona una o varias personas</label><div id="splitPeopleBox">${splitPeopleHtml()}</div></div><div class="field span2"><div class="notice"><b>100%</b>: una sola persona recibe el 100% del importe. <b>Partes iguales</b>: el total se divide entre tú y todas las personas seleccionadas. Por ejemplo, 10 € con 1 persona = 5 € para esa persona. <b>Personalizado</b>: indicas la parte de cada persona. «Yo debo» siempre se guarda con signo negativo en el saldo. Los saldos se compensan por persona.</div></div></div>`,()=>{const rawText=String(document.getElementById('dTotal').value||'').trim().replace(',','.');const raw=Number(rawText),selected=[...document.querySelectorAll('.dp:checked')].map(x=>x.value),mode=document.getElementById('dMode').value,direction=raw<0?'i_owe':document.getElementById('dDirection').value,concept=document.getElementById('dConcept').value.trim()||'Deuda compartida',groupId=document.getElementById('dGroup').value||'';if(!Number.isFinite(raw)||raw===0)throw Error('Introduce un importe distinto de 0, por ejemplo 100 o -100');const total=Math.abs(raw);if(!selected.length)throw Error('Selecciona al menos una persona');if(mode==='full'&&selected.length!==1)throw Error('Para el 100%, selecciona exactamente una persona');let shares;if(mode==='full'){shares=[{personId:selected[0],amount:+total.toFixed(2)}]}else if(mode==='equal'){const cents=Math.round(total*100),participants=selected.length+1,base=Math.floor(cents/participants),remainder=cents-base*participants;shares=selected.map((id,i)=>({personId:id,amount:(base+(i<remainder?1:0))/100}));}else{shares=selected.map(id=>({personId:id,amount:+String(document.getElementById('amt_'+id).value||'').replace(',','.')||0}));if(shares.some(x=>x.amount<=0))throw Error('Cada persona debe tener una cantidad mayor que 0');const sum=shares.reduce((s,x)=>s+x.amount,0);if(sum>total+0.001)throw Error(`Las partes (${eur(sum)}) no pueden superar el total (${eur(total)}).`)}const splitId=uid(),date=document.getElementById('dDate').value,accountId=document.getElementById('dAccount').value;if(direction==='owed_to_me')state.movements.push({id:uid(),type:'expense',date,amount:total,accountId,category:'Compartido',concept,splitId,splitTotal:total});shares.forEach(x=>{const p=state.people.find(z=>z.id===x.personId);state.debts.push({id:uid(),date,personId:x.personId,person:p?.name||'Sin nombre',amount:+x.amount.toFixed(2),signedAmount:direction==='i_owe'?-x.amount:x.amount,total,splitId,concept,collected:false,direction,groupId})});save();closeModal();render();toast(direction==='owed_to_me'?'Deuda creada: te deben dinero':'Deuda creada: tú debes dinero')})}
function openDebtEdit(id){const d=state.debts.find(x=>x.id===id);if(!d)return;openModal('Editar deuda',`<div class="formgrid"><div class="field"><label>Fecha</label><input class="input" id="edDate" type="date" value="${esc(d.date||today())}"></div><div class="field"><label>Importe</label><input class="input" id="edAmount" type="number" min="0.01" step="0.01" value="${Number(d.amount||0)}"></div><div class="field span2"><label>Persona</label><select id="edPerson">${state.people.map(p=>`<option value="${p.id}" ${p.id===d.personId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field span2"><label>Concepto</label><input class="input" id="edConcept" value="${esc(d.concept||'')}"></div><div class="field span2"><label>Dirección</label><select id="edDirection"><option value="owed_to_me" ${d.direction!=='i_owe'?'selected':''}>Me deben</option><option value="i_owe" ${d.direction==='i_owe'?'selected':''}>Yo debo</option></select></div></div><div class="notice" style="margin-top:12px">Edita este detalle de deuda. El movimiento original no se modifica.</div>`,()=>{const personId=document.getElementById('edPerson').value,amount=+document.getElementById('edAmount').value,concept=document.getElementById('edConcept').value.trim();if(!personId)throw Error('Selecciona una persona');if(!(amount>0))throw Error('El importe debe ser mayor que 0');if(!concept)throw Error('Escribe un concepto');const p=state.people.find(x=>x.id===personId);Object.assign(d,{date:document.getElementById('edDate').value,personId,person:p?.name||'Sin nombre',amount:+amount.toFixed(2),concept,direction:document.getElementById('edDirection').value});save();closeModal();render();toast('Deuda editada')})}
function delDebt(id){const d=state.debts.find(x=>x.id===id);if(!d)return;if(!confirm(`¿Eliminar esta deuda de ${personName(d.personId)||d.person}? Esta acción no borrará el movimiento original.`))return;state.debts=state.debts.filter(x=>x.id!==id);state.collections=state.collections.filter(x=>x.debtId!==id);save();render();toast('Deuda eliminada')}
function collectDebt(id){const d=state.debts.find(x=>x.id===id);if(!d||d.collected)return;if(!state.accounts.length)return alert('Crea una cuenta para registrar el pago.');const isOwedToMe=d.direction!=='i_owe';openModal(isOwedToMe?'Registrar cobro':'Registrar pago',`<div class="formgrid"><div class="field span2"><label>Cuenta ${isOwedToMe?'donde entra':'desde la que sale'} el dinero</label><select id="coAccount">${state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div></div><p>${esc(personName(d.personId)||d.person)} ${isOwedToMe?'te debe':'recibirá'} <b>${eur(d.amount)}</b>.</p>`,()=>{d.collected=true;const person=personName(d.personId)||d.person;const accountId=document.getElementById('coAccount').value;state.collections.push({id:uid(),debtId:d.id,personId:d.personId,person,amount:d.amount,date:today(),accountId,direction:d.direction});state.movements.push({id:uid(),type:isOwedToMe?'income':'expense',date:today(),amount:d.amount,accountId,category:isOwedToMe?'Deudas cobradas':'Deudas pagadas',concept:(isOwedToMe?'Cobro de ':'Pago a ')+person,splitId:d.splitId||''});save();closeModal();render();toast(isOwedToMe?'Cobro registrado':'Pago registrado')})}

function filterMov(){const t=document.getElementById('mfType')?.value||'',a=document.getElementById('mfAccount')?.value||'',q=(document.getElementById('mfSearch')?.value||'').toLowerCase(),f=document.getElementById('mfFrom')?.value||'',to=document.getElementById('mfTo')?.value||'';const ms=state.movements.filter(m=>(!t||m.type===t)&&(!a||(m.type==='transfer'?(m.from===a||m.to===a):m.accountId===a))&&(!q||(m.concept+' '+(m.category||'')+' '+(m.subcategory||'')).toLowerCase().includes(q))&&(!f||m.date>=f)&&(!to||m.date<=to));const el=document.getElementById('movementResults');if(el)el.innerHTML=movementTable(ms)}
function filterHist(){const t=document.getElementById('hfType')?.value||'',c=document.getElementById('hfCat')?.value||'',a=document.getElementById('hfAccount')?.value||'',person=document.getElementById('hfPerson')?.value||'',q=(document.getElementById('hfSearch')?.value||'').toLowerCase(),f=document.getElementById('hfFrom')?.value||'',to=document.getElementById('hfTo')?.value||'';const ms=state.movements.filter(m=>{if(!(m.type==='income'||m.type==='expense'))return false;if(t&&m.type!==t)return false;if(c&&m.category!==c)return false;if(a&&m.accountId!==a)return false;if(q&&!(m.concept+' '+(m.category||'')+' '+(m.subcategory||'')).toLowerCase().includes(q))return false;if(f&&m.date<f)return false;if(to&&m.date>to)return false;if(person){const ids=new Set(state.debts.filter(d=>d.personId===person).map(d=>d.splitId).filter(Boolean));if(!ids.has(m.splitId))return false}return true});const tt=totals(ms),el=document.getElementById('histResults');if(!el)return;el.innerHTML=`<div class="grid" style="margin-bottom:14px"><div class="card metric"><div class="label">Ingresos filtrados</div><div class="value positive">${eur(tt.i)}</div></div><div class="card metric"><div class="label">Gastos filtrados</div><div class="value negative">${eur(tt.e)}</div></div><div class="card metric"><div class="label">Balance</div><div class="value">${eur(tt.i-tt.e)}</div></div><div class="card metric"><div class="label">Movimientos</div><div class="value">${ms.length}</div></div></div>${movementTable(ms)}`}
function csvEscape(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function exportCSV(){const rows=[['Fecha','Tipo','Concepto','Importe','Cuenta','Categoría','Subcategoría','Personas'],...state.movements.map(m=>{const ps=m.splitId?[...new Set(state.debts.filter(d=>d.splitId===m.splitId).map(d=>personName(d.personId)||d.person))].join(', '):'';return [m.date,m.type,m.concept,m.amount,m.type==='transfer'?accName(m.from)+' -> '+accName(m.to):accName(m.accountId),m.category||'',m.subcategory||'',ps]})];download('finanzas-historico.csv','text/csv;charset=utf-8','\ufeff'+rows.map(r=>r.map(csvEscape).join(';')).join('\n'))}
function exportJSON(){download('finanzas-backup.json','application/json',JSON.stringify(state,null,2))}function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(){const f=document.getElementById('importFile').files[0];if(!f)return alert('Selecciona un archivo JSON.');const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.accounts||!x.movements)throw Error('Copia no válida');state={...defaultState,...x,settings:{...defaultState.settings,...(x.settings||{})}};['accounts','movements','recurring','categories','subcategories','people','groups','debts','collections'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});migratePeople(state);save();render();toast('Copia restaurada')}catch(e){alert('No se pudo importar: '+e.message)}};r.readAsText(f)}
function resetAll(){if(confirm('¿Borrar TODOS los datos?')){localStorage.removeItem(KEY);state=load();render();toast('Datos borrados')}}
function calcIRPF(){const s=+document.getElementById('irSalary').value,p=+document.getElementById('irPays').value,c=document.getElementById('irCom').value;const ss=s*.065,minE=5550*.095,minC=c==='Extremadura'?5550*.0775:5550*.095,b=s-ss-2000;function est(x){if(x<=12450)return x*.095;if(x<=20200)return (x-12450)*.12+12450*.095;if(x<=35200)return (x-20200)*.15+(20200-12450)*.12+12450*.095;if(x<=60000)return (x-35200)*.185+(35200-20200)*.15+(20200-12450)*.12+12450*.095;if(x<=300000)return (x-60000)*.225+(60000-35200)*.185+(35200-20200)*.15+(20200-12450)*.12+12450*.095;return (x-300000)*.245+(300000-60000)*.225+(60000-35200)*.185+(35200-20200)*.15+(20200-12450)*.12+12450*.095}function ext(x){if(c!=='Extremadura')return est(x);if(x<=12450)return x*.0775;if(x<=20200)return (x-12450)*.0975+12450*.0775;if(x<=24200)return (x-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=35200)return (x-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=60000)return (x-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=80200)return (x-60000)*.235+(60000-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=99200)return (x-80200)*.24+(80200-60000)*.235+(60000-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;if(x<=120200)return (x-99200)*.245+(99200-80200)*.24+(80200-60000)*.235+(60000-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775;return (x-120200)*.25+(120200-99200)*.245+(99200-80200)*.24+(80200-60000)*.235+(60000-35200)*.21+(35200-24200)*.175+(24200-20200)*.16+(20200-12450)*.0975+12450*.0775}const ie=est(b),ic=ext(b),it=ie+ic-minE-minC,net=s-(ss+ie+ic-minE-minC),pct=it/s*100,ordinary=p===14?((s-ie-ic+minE+minC)/14)-(ss/12):net/12,extra=p===14?(s-ie-ic+minE+minC)/14:null;document.getElementById('irResult').innerHTML=`<h2>Resultado</h2><div class="grid"><div class="metric"><div class="label">IRPF aplicado</div><div class="value">${pct.toFixed(2)}%</div></div><div class="metric"><div class="label">Neto anual</div><div class="value positive">${eur(net)}</div></div><div class="metric"><div class="label">Paga ordinaria</div><div class="value">${eur(ordinary)}</div></div><div class="metric"><div class="label">Paga extra</div><div class="value">${extra==null?'—':eur(extra)}</div></div></div><p class="sub">Seguridad Social: ${eur(ss)} · Base imponible: ${eur(b)} · IRPF estatal: ${eur(ie)} · IRPF comunidad: ${eur(ic)}</p>`}
function init(){nav();render()}
init();
</script></body></html>
